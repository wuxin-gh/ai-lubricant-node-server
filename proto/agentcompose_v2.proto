// ─────────────────────────────────────────────────────────────────────────────
// NodeService messages
// ─────────────────────────────────────────────────────────────────────────────

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_PENDING = 1; // registered, awaiting management approval
  NODE_STATUS_APPROVED = 2; // approved, eligible to receive sessions
  NODE_STATUS_REVOKED = 3; // revoked, connection refused
}

// NodeRole distinguishes what a connected node is for. An execution node runs
// provider CLIs and takes sessions; a management node only starts/stops
// execution nodes on its host on the server's behalf (it has no session
// capacity) and dials the same NodeConnect stream. A passive management node is
// a pure ownership container: it never dials in, carries no credential, and
// launches nothing — it exists only to own execution nodes, and the server
// treats it as approved+online at onboard.
enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_EXECUTION = 1;
  NODE_ROLE_MANAGEMENT = 2;
  NODE_ROLE_PASSIVE_MANAGEMENT = 3;
  // An iOS device host: it runs no coding sessions and launches no nodes. It
  // dials in for identity/heartbeat/version-report/self-upgrade only, and drives
  // its paired iPhones over a separate device-control WebSocket (the phone
  // command plane is disjoint from this control plane).
  NODE_ROLE_IOS_HOST = 4;
}

// NodeStartupMethod selects which install script the server hands out at
// onboarding and records how a node process is expected to run on its host.
enum NodeStartupMethod {
  NODE_STARTUP_METHOD_UNSPECIFIED = 0;
  NODE_STARTUP_METHOD_STANDALONE = 1; // run the binary directly
  NODE_STARTUP_METHOD_SYSTEMD = 2; // installed as a systemd unit
  NODE_STARTUP_METHOD_DOCKER = 3; // docker run
  NODE_STARTUP_METHOD_DOCKER_COMPOSE = 4; // docker compose up
}

// NodeUpstreamFrame: node → server. One envelope, oneof payload, mirroring the
// RunAttach/ExecAttach frame style (client_frame_id + oneof).
message NodeUpstreamFrame {
  string client_frame_id = 15;

  oneof frame {
    NodeRegister register = 1;
    NodeHeartbeat heartbeat = 2;
    NodeSessionOutput session_output = 3;
    NodeSessionResult session_result = 4;
    NodeCommandAck command_ack = 5;
    NodeError error = 6;
    // Reverse-proxy tunnel: the node streams an HTTP response back for a request
    // the server pushed down. Multiplexed over the single NodeConnect stream by
    // tunnel_id so many concurrent proxied requests share one connection.
    NodeTunnelResponse tunnel_response = 7;
    // Structured session event parsed by the node from the runtime's NDJSON
    // output (agent_event/agent_turn_completed/…). This is additive alongside
    // the raw session_output byte stream: it exposes tool calls, reasoning,
    // progress, todos, file changes and per-agent status the server can render.
    NodeSessionEventStructured session_event = 8;
    // Host terminal: PTY output bytes for an open terminal, correlated by
    // terminal_id (see NodeTerminalOpen).
    NodeTerminalOutput terminal_output = 9;
    // Host terminal: the shell exited (or could not be started); the terminal is
    // gone and the server should close the corresponding websocket.
    NodeTerminalExit terminal_exit = 10;
    // Host command result: one-shot command output correlated by request_id.
    NodeHostExecResult host_exec_result = 11;
    // Host file upload: per-chunk result correlated by upload_id.
    NodeFileUploadResult file_upload_result = 12;
    // Host terminals still open on this node, with the command each most recently
    // submitted. Reply to NodeTerminalListRequest, correlated by request_id.
    NodeTerminalListResult terminal_list_result = 13;
    // Long-running external tool (frpc/cloudflared/npc/…) the node started on
    // behalf of the tunnel manager. Streams stdout/stderr chunks + an exit event,
    // correlated by run_id. Unlike host_exec this is for daemons that stay alive.
    NodeToolRunEvent tool_run_event = 14;
    // Per-step progress of session preparation (workspace → clone → runtime
    // preflight → start). Lets a failed start name the step that broke instead
    // of surfacing one opaque exit code. Field number 16: 15 is client_frame_id.
    NodeSessionStage session_stage = 16;
    // ─── iOS host management (role ios_host) ─────────────────────────────────
    // The iOS host's inventory of physically attached/reachable iPhones. Sent
    // unsolicited on register, on USB/network attach-detach, after a claim or
    // release, and whenever a device's WDA state changes — so the server never
    // has to poll a host to know what hardware is on it.
    NodeIosDevicesReport ios_devices_report = 17;
    // Streamed progress of one WDA job (download → sign → install → launch).
    // Correlated by job_id; seq is monotonic per job so a reconnecting server
    // can tell gaps from reordering.
    NodeIosJobEvent ios_job_event = 18;
    // Terminal outcome of one WDA job. Always sent exactly once per job_id,
    // including on failure/cancellation, so a pending server-side future never
    // hangs on the ack timeout alone.
    NodeIosJobResult ios_job_result = 19;
    // ─── Generic node build pipeline ─────────────────────────────────────────
    // Streamed progress of one build (clone → steps → package → upload).
    // Correlated by build_id; seq is monotonic per build.
    NodeBuildEvent node_build_event = 20;
    // Terminal outcome of one build. Always sent exactly once per build_id,
    // including on failure/cancellation.
    NodeBuildResult node_build_result = 21;
    // ─── Async host-tool jobs (Xcode auto-install) ───────────────────────────
    // Streamed progress of one host-tool install job (download → verify →
    // extract → move → activate → probe). Correlated by job_id; seq is
    // monotonic per job. current/total bytes give the download stage a real
    // denominator (Xcode .xip is ~12GB).
    NodeHostToolJobEvent host_tool_job_event = 22;
    // Terminal outcome of one host-tool job. Always sent exactly once per
    // job_id, including on failure/cancellation. xcodebuild_version is the
    // freshly probed value so the server folds it into capabilities without
    // waiting for a node re-register.
    NodeHostToolJobResult host_tool_job_result = 23;
  }
}

// NodeDownstreamFrame: server → node. Session lifecycle commands pushed over
// the node's already-established outbound stream.
message NodeDownstreamFrame {
  string server_frame_id = 15;
  string created_at = 16;

  oneof frame {
    NodeRegistered registered = 1;
    NodeCreateSession create_session = 2;
    NodeDeleteSession delete_session = 3;
    NodeListSessions list_sessions = 4;
    NodeError error = 5;
    // Reverse-proxy tunnel: the server pushes an HTTP request for the node to
    // forward to a session-local service (jupyter/files/…). Correlated by
    // tunnel_id; the node replies with NodeTunnelResponse frames.
    NodeTunnelRequest tunnel_request = 6;
    // Multi-turn input: for an interactive session the server pushes a new user
    // turn (or an end-of-input signal) into the session's long-running provider
    // process. Session output continues to stream up via NodeSessionOutput.
    NodeSessionInput session_input = 7;
    // Management plane: the server asks a management node to launch an execution
    // node on its host (docker/systemd/…). The launched node then dials the
    // server itself and registers with the one-time token in the spec. The
    // management node acks with NodeCommandAck (ok = launch started).
    NodeCreateExecutionNode create_execution_node = 8;
    // Management plane: the server asks a management node to stop/remove an
    // execution node it previously launched, by launch handle. Acked with
    // NodeCommandAck.
    NodeDeleteExecutionNode delete_execution_node = 9;
    // First frame the server sends after the stream opens: authoritative time
    // the node uses to derive its TOTP code for the subsequent NodeRegister.
    NodeServerHello server_hello = 10;
    // ---- Split session configuration (applied before/independent of runtime
    // start). Each carries a revision so the node can report which config
    // version is on disk vs. which the running editor actually loaded. The node
    // writes them to the session's per-editor config files and acks with
    // NodeCommandAck (applied_revision + restart_required). ----
    // Configure the LLM the session's editor talks to DIRECTLY (no server-side
    // proxy): the node writes the provider's config/env to point at the LLM
    // service in the payload with the supplied key.
    ConfigureSessionLLM configure_session_llm = 11;
    // Full desired set of MCP servers for the session. The node rewrites the
    // editor's managed MCP config block to exactly this set.
    ApplySessionMCPs apply_session_mcps = 12;
    // Full desired set of skills. The node syncs them into the session skills dir.
    ApplySessionSkills apply_session_skills = 13;
    // Full desired set of plugins. The node fetches/installs them locally.
    ApplySessionPlugins apply_session_plugins = 14;
    // Start the editor runtime for a session that was created without
    // auto-start (config applied first). No-op if already running.
    StartSessionRuntime start_session_runtime = 17;
    // Stop the current editor process (keeping workDir/git/state/config) and
    // start it again against the latest applied config revision.
    RestartSessionRuntime restart_session_runtime = 18;
    // Select/patch the editor mode (permission/approval档位) for a session.
    ConfigureSessionMode configure_session_mode = 19;
    // Ask the node to package the session's working tree and make it available
    // for the server to pull back (artifact collection).
    CollectSessionArtifacts collect_session_artifacts = 20;
    // ─── Node forward HTTP proxy ────────────────────────────────────────────
    // Server -> node: perform one HTTP request to an absolute URL. The node
    // makes the outbound connection (including TLS) and streams the response
    // back as NodeTunnelResponse frames correlated by tunnel_id.
    NodeProxyRequest proxy_request = 21;
    // Ask an execution node to install or upgrade one of the supported editor
    // CLIs (claude/codex/gemini/opencode) using that editor's own official
    // command. Acked with NodeCommandAck; on success editor_version carries the
    // freshly probed version string so the server can refresh capabilities.
    NodeManageEditor manage_editor = 22;
    // Ask a node to self-upgrade its own binary: download the platform build at
    // download_url, verify the optional sha256, atomically replace the running
    // binary, and re-exec. Acked with NodeCommandAck (ok = accepted + download
    // started); the upgrade truly takes effect when the node reconnects with the
    // new client_version. docker-deployed nodes reject it (re-pull the image).
    NodeSelfUpgrade self_upgrade = 23;
    // Ask a node to update its separately packaged JavaScript runtime. Unlike
    // self_upgrade this does not restart the Go process; newly started editor
    // sessions use the replacement runtime after the node acks completion.
    NodeRuntimeUpgrade runtime_upgrade = 34;
    // ─── Host terminal (management console shell) ───────────────────────────
    // Server -> node: open an interactive PTY shell on the node's HOST (not a
    // session sandbox), keyed by terminal_id. The node spawns the shell in a
    // pseudo-terminal and streams its output back as NodeTerminalOutput frames.
    // Multiplexed over the single NodeConnect stream by terminal_id, so many
    // concurrent terminals share one connection (same pattern as tunnels).
    NodeTerminalOpen terminal_open = 24;
    // Server -> node: stdin bytes for an open terminal.
    NodeTerminalInput terminal_input = 25;
    // Server -> node: resize an open terminal's PTY window.
    NodeTerminalResize terminal_resize = 26;
    // Server -> node: close an open terminal (kill the shell, release the PTY).
    NodeTerminalClose terminal_close = 27;
    // Server -> node: reattach to a terminal that already exists on the node,
    // resuming its output stream after `after_sequence`. Sent on a NodeConnect
    // reconnect: the PTY (and its foreground processes) survived the dropped
    // stream, so the server asks the node to resume streaming rather than opening
    // a fresh shell. The node replies with buffered NodeTerminalOutput frames, or
    // a NodeTerminalExit carrying error="terminal_not_found" if it is really gone.
    NodeTerminalAttach terminal_attach = 31;
    // Server -> node: report every host terminal this node still has open, with
    // the command each one most recently submitted. This is what the management
    // console's terminal tab renders — the node is the source of truth for which
    // PTYs exist, so the server asks rather than trusting its own bookkeeping.
    NodeTerminalListRequest terminal_list = 32;
    // Server -> node: interrupt whatever the terminal is currently running by
    // writing the interrupt character into its PTY. This ends the running command
    // and hands the prompt back; it does NOT close the terminal.
    NodeTerminalInterrupt terminal_interrupt = 33;
    // Server -> node: execute one host-shell command and return structured output.
    NodeHostExecRequest host_exec = 28;
    // Server -> node: one chunk of a host file upload, correlated by upload_id.
    NodeFileUploadRequest file_upload = 30;
    // Global public-IP lookup configuration. The common node client consumes
    // this snapshot; role-specific handlers never see it.
    NodePublicIPLookupConfig public_ip_lookup_config = 29;
    // This node's own egress proxy for GitHub downloads (self-upgrade /
    // runtime-upgrade). Per-node binding (set at onboard / node detail page),
    // pushed on connect + on change, revision-gated like public_ip_lookup_config.
    NodeProxyConfig node_proxy_config = 35;
    // ─── Long-running external tool (tunnel manager) ─────────────────────────
    // Server -> node: start a long-running external CLI (frpc/cloudflared/npc)
    // on the node host. The node streams stdout/stderr back as NodeToolRunEvent
    // frames correlated by run_id, and a final exited event with the exit code.
    // Unlike host_exec this is for daemons that stay alive; stop with
    // NodeToolRunStop. The node is the process owner; on NodeConnect reconnect
    // the process keeps running and the server reattaches by run_id (later).
    NodeToolRunRequest tool_run_request = 36;
    // Server -> node: stop a previously started tool run by run_id (SIGTERM,
    // then SIGKILL after a grace period). The node sends a final exited event.
    NodeToolRunStop tool_run_stop = 37;
    // Server -> node: create a named shared environment directory on this host,
    // or remove one. The node owns the path layout; the server only names the id.
    NodeManageEnvironment manage_environment = 38;
    // Server -> node: install the exact desired skill/plugin set into a shared
    // environment's HOME. This is the *environment maintenance* channel — the
    // real install/uninstall — as opposed to a task activating a subset.
    NodeSyncEnvironment sync_environment = 39;
    // Server -> node: report what is physically installed in an environment HOME
    // so the server can diff it against the configured set.
    NodeInspectEnvironment inspect_environment = 40;
    // ─── iOS host management (role ios_host) ─────────────────────────────────
    // Ask an iOS host to re-enumerate its attached iPhones and reply with a
    // NodeIosDevicesReport. The host also reports unsolicited on attach/detach,
    // so this is the user-pressed "rescan" path, not the only source of truth.
    NodeIosDiscover ios_discover = 41;
    // Ask an iOS host to adopt one discovered iPhone: redeem the one-time
    // device-control pairing code in the payload, persist the resulting 0600
    // credential, and start that device's device-control connection. The host
    // acks with NodeCommandAck once the credential is on disk — the device then
    // shows up through the normal device-control register path.
    NodeIosClaimDevice ios_claim_device = 42;
    // Ask an iOS host to stop driving a device and (optionally) delete its local
    // credential. Sent alongside a server-side revoke so the host does not keep
    // reconnecting a device whose token is already dead.
    NodeIosReleaseDevice ios_release_device = 43;
    // Push the desired per-device configuration (transport, WDA identity/policy)
    // to an iOS host. Revision-gated: a host that already applied a newer
    // revision acks with what it has rather than rolling back.
    NodeIosConfigureDevice ios_configure_device = 44;
    // Ask an iOS host to run one WDA job for a device: fetch the approved
    // artifact, sign it (App Store Connect API or supplied p12), install it,
    // launch the runner and verify readiness. Progress streams back as
    // NodeIosJobEvent; the outcome as NodeIosJobResult.
    NodeIosWdaJobRequest ios_wda_job = 45;
    // Ask an iOS host to cancel a running WDA job at the next stage boundary.
    NodeIosJobCancel ios_job_cancel = 46;
    // Server -> node: scan the operator's real HOME for the skill/plugin/MCP the
    // providers actually discover in a system-env session. No env_id — the
    // target is os.UserHomeDir(). Answers via
    // NodeCommandAck.system_env_inventory (field 10).
    NodeInspectSystemEnv inspect_system_env = 47;
    // Server -> node: install platform resources into the operator's real HOME
    // (system env). INCREMENTAL only — never prunes, and remove= only accepts
    // entries the platform itself installed (manifest-tracked), so hand-installed
    // entries are never deleted by the server.
    NodeSyncSystemEnv sync_system_env = 48;
    // Server -> node: tar up one resource out of the operator's real HOME and
    // POST it to a server pre-signed upload endpoint, so a locally installed
    // skill/plugin can be archived into the platform resource library.
    NodeArchiveSystemEnvResource archive_system_env_resource = 49;
    // ─── Generic node build pipeline ─────────────────────────────────────────
    // Server -> node: run one build (clone fixed source, exec steps, upload the
    // artifact). Recipe-agnostic: the server renders the steps, the node only
    // executes them. WDA is the first recipe; the frame shape is deliberately
    // generic so later recipes (docker image, go binary, …) need no proto change.
    NodeBuildRequest node_build = 50;
    // Server -> node: cancel a running build at the next stage boundary.
    NodeBuildCancel node_build_cancel = 51;
    // Server -> node: install a host-level runtime dependency that is not an
    // editor CLI — currently Node.js (node + npm). The node downloads the
    // official platform archive at download_url, verifies it (sha256, or the
    // distribution's SHASUMS256.txt when sha256 is empty), extracts it under the
    // node-managed tools dir and re-probes the installed versions. Like
    // manage_editor this carries a whitelisted tool id, not an arbitrary command.
    // Acked with NodeCommandAck; on success node_version/npm_version carry the
    // freshly probed versions so the server can refresh capabilities.
    NodeInstallHostTool install_host_tool = 52;
    // ─── Async host-tool jobs (Xcode auto-install) ───────────────────────────
    // Server -> node: run one long-running host-tool install job (currently
    // Xcode). The node acks "accepted" immediately (within seconds) and streams
    // progress as NodeHostToolJobEvent / a terminal NodeHostToolJobResult — the
    // install itself (a ~12GB .xip download + extraction) takes hours and can
    // never fit the synchronous InstallHostTool ack window. tool is a whitelist
    // id; download_url must be an https .xip direct link resolved by the server.
    NodeHostToolJob host_tool_job = 53;
    // Server -> node: cancel a running host-tool job at the next stage boundary.
    NodeHostToolJobCancel host_tool_job_cancel = 54;
    // Server -> node: re-probe every capability label NOW and reply with the
    // full NodeCapabilities snapshot (the same shape the node registers with).
    // Lets the console refresh editors/host tools/os versions after an operator
    // installs something on the node host without restarting the node process.
    // Acked with NodeCommandAck; on success refreshed_capabilities carries the
    // freshly probed snapshot. Handled by the common node client (all roles).
    NodeRefreshLabelsRequest refresh_labels = 55;
  }
}

// Server -> node: payload of the refresh_labels frame. Deliberately empty —
// the node knows what to probe; the reply carries the data.
message NodeRefreshLabelsRequest {
}

// EnvironmentAction selects create vs. remove for ManageNodeEnvironment.
enum EnvironmentAction {
  ENVIRONMENT_ACTION_UNSPECIFIED = 0;
  ENVIRONMENT_ACTION_CREATE = 1;
  ENVIRONMENT_ACTION_REMOVE = 2;
}

// Server -> node: provision or delete one shared environment on the node host.
// A shared environment is a persistent HOME directory that any number of
// sessions can run against, so installed dependencies and CLI login state
// survive across tasks. The node resolves env_id to its own local path (under
// its work root) — the server stores only the id, never a node-local path,
// matching how NodeTerminalOpen.session_id already works.
//
// CREATE is idempotent: an existing environment directory is left as-is and
// acked ok, so a retried dispatch cannot wipe a live environment. REMOVE
// deletes the directory tree and everything installed in it.
message NodeManageEnvironment {
  string env_id = 1;
  EnvironmentAction action = 2;
}

// Server -> node: make a shared environment's installed skill/plugin set match
// this list exactly. This is environment *maintenance*: the node downloads and
// lays out the files under the environment HOME, and prunes managed entries that
// are no longer desired.
//
// Two things are deliberately NOT here:
//   - MCP. It is config, not a file; materializing it into a shared HOME would
//     write per-task credentials into a directory other tasks read. MCP is
//     resolved per task into that task's private state root instead.
//   - A task's active subset. Removing a skill from a task must not uninstall it
//     from the environment, so activation is carried per session (see
//     NodeCreateSession.active_skills) and never through this frame.
message NodeSyncEnvironment {
  string env_id = 1;
  repeated SkillSpec skills = 2;
  repeated NodePluginSpec plugins = 3;
}

// Server -> node: list what is actually on disk in an environment HOME. The node
// answers with NodeCommandAck.environment_inventory. Used to show 已安装 /
// 待安装 / 多余 against the configured set — including entries an operator
// installed by hand from a maintenance shell, which appear with no configured
// counterpart.
message NodeInspectEnvironment {
  string env_id = 1;
}

// One physically present resource in an environment HOME, as observed by the
// node. kind is "skill" or "plugin" (MCP is never on disk). version is best
// effort: it comes from the package manifest when one is present, else empty.
message NodeEnvironmentEntry {
  string kind = 1;
  string name = 2;
  string version = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// System environment (env_mode="system") — the node operator's REAL HOME.
//
// Why this is a separate channel from the shared-environment one above: a shared
// environment is a directory the node created and owns, so an exact-set sync
// (install the desired list, prune the rest) is correct there. The operator's
// HOME is not ours: it holds skills/plugins/MCP the operator installed by hand,
// which providers already discover today (claude reads ~/.claude/skills, others
// read ~/.agents/{skills,plugins}, gemini ~/.gemini/extensions, MCP ~/.mcp.json).
// Pruning it would delete the operator's own setup. So this channel is:
//   - read-first: the inventory is the point, so the console can finally SHOW
//     what a system-env session actually gets;
//   - incremental on write: install/skip/overwrite one entry at a time, and only
//     ever remove entries the platform itself installed (tracked in a manifest
//     under <home>/.agent-compose/system-env.json).
// None of these frames carry env_id — there is exactly one operator HOME per
// node, so the node id addresses it.
// ─────────────────────────────────────────────────────────────────────────────

// Server -> node: enumerate what the providers would discover in the operator's
// HOME. Answered with NodeCommandAck.system_env_inventory.
message NodeInspectSystemEnv {
  // provider narrows the scan to one provider's discovery paths (claude/codex/
  // gemini/opencode). Empty scans every known path plus the MCP config.
  string provider = 1;
}

// Server -> node: install platform resources into the operator's HOME, and/or
// remove platform-installed ones. Deliberately NOT an exact-set sync.
message NodeSyncSystemEnv {
  repeated SkillSpec skills = 1;
  repeated NodePluginSpec plugins = 2;
  // overwrite decides what happens when the target name already exists on disk:
  // false (default) skips it and reports it as skipped, true replaces it. The
  // caller surfaces this as a user choice because the existing copy may be the
  // operator's own.
  bool overwrite = 3;
  // remove names entries to delete. The node refuses any name that is not in its
  // platform manifest, so a hand-installed resource cannot be deleted through
  // this API even if the server asks.
  repeated string remove = 4;
}

// Server -> node: tar one resource out of the operator's HOME and POST it to a
// server upload endpoint. Used to archive a locally installed skill/plugin into
// the platform resource library so other nodes/environments can reuse it.
// The bytes travel over HTTP, not this stream: the frame only carries where to
// send them and the one-time token to authorize it.
message NodeArchiveSystemEnvResource {
  string kind = 1; // skill | plugin (MCP is config, nothing to archive)
  string name = 2;
  string upload_url = 3;
  string upload_token = 4;
}

// One resource the node observed in the operator's HOME.
message NodeSystemEnvEntry {
  string kind = 1;    // skill | plugin | mcp
  string name = 2;
  string version = 3; // best effort; empty is normal (skills carry no version)
  // provider whose discovery path this entry was found under — i.e. which
  // editor's own config/directory declared it. Empty only for the .agents
  // standard tree (no single owner). MCP entries carry the editor whose config
  // file declared them (claude/codex/gemini/opencode); ~/.mcp.json is claude's
  // project-level config, so it reports claude.
  string provider = 4;
  string path = 5; // HOME-relative path, so the console can explain the source
  // platform_managed is true when this entry is in the node's platform manifest
  // (i.e. the platform installed it). Only these may be removed via
  // NodeSyncSystemEnv.remove; everything else is the operator's and read-only.
  bool platform_managed = 6;
  // best-effort human description: SKILL.md frontmatter `description`, a plugin
  // manifest's `description`, or empty (MCP configs carry none).
  string description = 7;
  // Editors that would actually LOAD this entry in a system-env session — the
  // tab-attribution fact, owned by the node because it owns the scan targets
  // and the runtime read rules. One resource read by several editors (the
  // .agents tree, or a platform skill mirrored into .claude/skills) lists all
  // of them; the console groups tabs by this, not by provider.
  repeated string readers = 8;
}

// EditorAction selects install vs. upgrade for ManageEditor.
enum EditorAction {
  EDITOR_ACTION_UNSPECIFIED = 0;
  EDITOR_ACTION_INSTALL = 1;
  EDITOR_ACTION_UPGRADE = 2;
}

// Server -> node: install or upgrade one editor CLI. editor is one of
// claude/codex/gemini/opencode (case-insensitive); unknown values fail the ack.
message NodeManageEditor {
  string editor = 1;
  EditorAction action = 2;
}

// Server -> node: self-upgrade the node binary. download_url is the full address
// of the release asset for this node's os/arch (a public GitHub release direct
// link; the node needs no admin session). sha256, when non-empty, is checked
// before the binary is swapped in. target_version is informational (the version
// the server expects after restart).
//
// The proxy_* fields let the server hand the node an egress route for the
// download, since a node behind a restricted network may not reach GitHub
// directly. Empty proxy_mode means download directly.
message NodeSelfUpgrade {
  string target_version = 1;
  string download_url = 2;
  string sha256 = 3;
  // "" | "network" | "url_prefix"
  string proxy_mode = 4;
  // network mode: full proxy URL (http/https/socks5, credentials pre-injected).
  string proxy_url = 5;
  // url_prefix mode: reverse-proxy prefix (Cloudflare Worker style) the node
  // prepends to download_url.
  string proxy_url_prefix = 6;
}

// Server -> node: update the separately packaged JavaScript runtime. The node
// downloads a platform-specific tar.gz, verifies sha256, extracts into a staged
// directory, and atomically switches the managed runtime directory. No Go
// process restart is required. proxy_* mirrors NodeSelfUpgrade.
message NodeRuntimeUpgrade {
  string target_version = 1;
  string download_url = 2;
  string sha256 = 3;
  string proxy_mode = 4;
  string proxy_url = 5;
  string proxy_url_prefix = 6;
}

// Server -> node: install a host-level runtime dependency (currently Node.js).
//
// The node resolves its own os/arch at runtime and the server picks the matching
// official archive URL (nodejs.org/dist tar.gz on linux/darwin, zip on windows).
// The node downloads it under its managed tools dir (~/.agent-compose/tools),
// verifies sha256 when non-empty (otherwise it best-effort fetches the dist's
// SHASUMS256.txt from the same directory and verifies against that), extracts
// and atomically swaps in a node-managed install. No sudo: the managed dir is
// beside the node state dir and writable by the node process; npm's global
// prefix lands inside it too, so subsequent `npm i -g` editor installs need no
// elevated privileges. target_version is informational. proxy_* mirrors
// NodeSelfUpgrade.
message NodeInstallHostTool {
  string tool = 1;            // "nodejs" (whitelist on the server)
  string target_version = 2;  // informational, e.g. "22.17.0"
  string download_url = 3;   // platform archive (tar.gz / zip)
  string sha256 = 4;          // optional; empty = verify via SHASUMS256.txt
  string proxy_mode = 5;
  string proxy_url = 6;
  string proxy_url_prefix = 7;
}

// Server -> node: open a host-shell terminal. cwd empty means the node's own
// user home directory (os.UserHomeDir()); shell empty means the node's
// platform default ($SHELL / bash / sh on unix, powershell.exe / cmd.exe on
// windows). terminal_size is the initial PTY window; a real terminal is
// unusable at 0x0, so the node falls back to a sane default (80x24) if unset.
message NodeTerminalOpen {
  string terminal_id = 1;
  string shell = 2;
  string cwd = 3;
  AttachTerminalSize terminal_size = 4;
  // Optional: open the shell in this session's workspace directory. When set and
  // the session exists, the node resolves the workspace path itself and ignores
  // `cwd` — the server never learns (or dictates) the node-local absolute path.
  // Empty preserves the legacy behavior (explicit `cwd`, else node home).
  string session_id = 5;
  // Optional: open the shell inside a named shared environment's HOME, for
  // environment maintenance (install deps, log a CLI in, update toolchain).
  // When set, the node resolves the env directory itself and points HOME at it,
  // so the login shell lands inside the environment rather than the node
  // operator's home. The server stores only the id, never a node-local path.
  // Empty preserves the legacy behavior. session_id and env_id are mutually
  // exclusive: env_id wins when both are set (a maintenance shell targets the
  // environment, not a session).
  string env_id = 6;
}

// Server -> node: stdin bytes for an open terminal.
message NodeTerminalInput {
  string terminal_id = 1;
  bytes data = 2;
}

// Server -> node: resize an open terminal's PTY window.
message NodeTerminalResize {
  string terminal_id = 1;
  AttachTerminalSize terminal_size = 2;
}

// Server -> node: close an open terminal (kill the shell, release the PTY).
message NodeTerminalClose {
  string terminal_id = 1;
}

// Server -> node: resume streaming an EXISTING terminal after a NodeConnect
// reconnect. The node keeps its PTYs alive across a dropped control stream, so a
// reconnect must reattach rather than open a new shell (which would lose cwd and
// any running foreground process).
//
// after_sequence is the sequence number of the last NodeTerminalOutput the server
// successfully handed to a browser. The node replays whatever it still holds in
// its bounded per-terminal buffer beyond that point, then resumes live streaming.
// If the requested point has already been evicted from the buffer, the node sets
// replay_truncated on the first frame so the UI can say output was dropped
// instead of silently presenting a gap as continuous.
message NodeTerminalAttach {
  string terminal_id = 1;
  uint64 after_sequence = 2;
}

// Server -> node: list the host terminals this node still has open.
// Correlated by request_id; the node replies with NodeTerminalListResult.
message NodeTerminalListRequest {
  string request_id = 1;
}

// Node -> server: one open host terminal and what it is currently running.
//
// `current_command` is the last command line the terminal SUBMITTED — the node
// records it when it sees a carriage return in the PTY input stream, whether the
// bytes came from an operator's keystrokes or from an agent command. `running`
// says whether that command has produced its shell prompt back yet; when false
// the terminal is idle at a prompt and current_command is merely the last thing
// that ran. The node does not inspect OS process tables: this is a record of
// what was typed, which is exactly what the console needs to decide whether
// interrupting the terminal would kill work someone cares about.
message NodeTerminalStatus {
  string terminal_id = 1;
  // Last submitted command line ("" when nothing has been submitted yet).
  string current_command = 2;
  // True while that command is still running (no prompt back yet).
  bool running = 3;
  // Where the command came from: "agent" when the server injected it through the
  // agent-command path, "personal" when an operator typed it.
  string source = 4;
  // RFC3339Nano when the command was submitted; empty when nothing has run.
  string started_at = 5;
  // RFC3339Nano when the PTY was opened.
  string created_at = 6;
  // True while the control stream is relaying this terminal to a browser.
  bool attached = 7;
}

message NodeTerminalListResult {
  string request_id = 1;
  repeated NodeTerminalStatus terminals = 2;
}

// Server -> node: interrupt the command the terminal is currently running by
// writing the interrupt character into its PTY, then hand the prompt back. The
// terminal itself stays open — this is "stop what it is doing", not "close it".
message NodeTerminalInterrupt {
  string terminal_id = 1;
}

// Node -> server: PTY output bytes (stdout+stderr interleaved, as the PTY
// itself interleaves them).
//
// sequence is monotonic per terminal, starting at 1. It lets the server resume a
// terminal after a NodeConnect reconnect (see NodeTerminalAttach.after_sequence)
// and dedupe a frame that was replayed after being delivered. replay_truncated is
// set on the first frame of a reattach whose requested resume point had already
// been evicted from the node's bounded buffer: some output is genuinely lost and
// the UI must say so rather than imply a continuous stream.
message NodeTerminalOutput {
  string terminal_id = 1;
  bytes data = 2;
  uint64 sequence = 3;
  bool replay_truncated = 4;
}

// Node -> server: the shell process exited, or the terminal failed to start
// (error non-empty in that case). The node drops its PTY state after sending
// this; the server should treat the terminal as gone.
message NodeTerminalExit {
  string terminal_id = 1;
  int32 exit_code = 2;
  string error = 3;
}

// Server -> node: run one host-shell command non-interactively and return its
// structured result. Unlike NodeTerminalOpen (an interactive PTY shared by a
// human), this is a one-shot `os/exec` invocation: separated stdout/stderr and a
// per-command exit code, suitable for an automated caller (the server-side AI
// admin assistant). Correlated by request_id.
message NodeHostExecRequest {
  string request_id = 1;
  // command is executed via the host shell (`/bin/sh -c` on unix,
  // `cmd.exe /c` on windows). cwd empty means the node user's home directory.
  string command = 2;
  string cwd = 3;
  // timeout_ms caps the run; 0 means a sane default (the node-enforced cap).
  // The node kills the process on timeout and reports a non-zero exit with
  // error="timeout".
  uint32 timeout_ms = 4;
  // max_output_bytes caps stdout and stderr separately; 0 means a sane default.
  // Each stream is truncated at the cap and the corresponding *_truncated flag
  // is set on the result so the caller never receives unbounded output.
  uint32 max_output_bytes = 5;
  string node_id = 6;
}

// Node -> server: the result of a NodeHostExecRequest, correlated by request_id.
// Modeled on ExecResult: separated streams, exit code, truncation flags, error.
message NodeHostExecResult {
  string request_id = 1;
  int32 exit_code = 2;
  bool success = 3; // exit_code == 0 and no spawn/timeout error
  string stdout = 4;
  string stderr = 5;
  bool stdout_truncated = 6;
  bool stderr_truncated = 7;
  // error is non-empty when the command could not run at all (spawn failure,
  // cwd missing, timeout killed the process). A non-zero exit_code from a
  // command that DID run is NOT an error here.
  string error = 8;
}

// NodeToolRunKind tags one chunk of a tool-run event stream.
enum NodeToolRunKind {
  NODE_TOOL_RUN_KIND_UNSPECIFIED = 0;
  NODE_TOOL_RUN_KIND_STDOUT = 1;   // a stdout chunk
  NODE_TOOL_RUN_KIND_STDERR = 2;   // a stderr chunk
  NODE_TOOL_RUN_KIND_EXITED = 3;   // process exited (exit_code valid)
  NODE_TOOL_RUN_KIND_STARTED = 4;  // exec succeeded (pid valid)
}

// NodeToolRunRequest: server -> node. Start a long-running external CLI.
//
// binary_path is the absolute path to the binary (or a bare name resolved on
// PATH). args are passed through verbatim (no shell). env is merged onto the
// node's environment. cwd empty = node user home. The node streams output as
// NodeToolRunEvent frames until the process exits; stop it with NodeToolRunStop.
//
// max_event_bytes caps each stdout/stderr chunk; 0 = a sane default. There is
// no overall timeout — the process runs until it exits or is stopped.
message NodeToolRunRequest {
  string run_id = 1;
  string binary_path = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string cwd = 5;
  uint32 max_event_bytes = 6;
  string node_id = 7;
  // Monotonic runtime config revision. Events from an older revision must not
  // overwrite the state of the replacement process after a group restart.
  uint64 revision = 8;
}

// NodeToolRunStop: server -> node. Stop a running tool by run_id.
message NodeToolRunStop {
  string run_id = 1;
  // grace_ms is the SIGTERM->SIGKILL grace window; 0 = a sane default.
  uint32 grace_ms = 2;
  string node_id = 3;
}

// NodeToolRunEvent: node -> server. One chunk of a tool run's output stream,
// or the terminal exit event. Correlated by run_id.
message NodeToolRunEvent {
  string run_id = 1;
  NodeToolRunKind kind = 2;
  bytes data = 3;           // stdout/stderr chunk (empty for STARTED/EXITED)
  int32 exit_code = 4;      // valid only for EXITED
  string error = 5;         // spawn failure / kill error / etc.
  uint64 revision = 6;
  int64 pid = 7;            // valid for STARTED
}

// Lightweight process inventory carried in heartbeats so the server can
// reconcile desired runtimes after a control-stream reconnect.
message NodeActiveToolRun {
  string run_id = 1;
  uint64 revision = 2;
  int64 pid = 3;
}

// FollowToolRunRequest: open a Connect server-stream that replays the live
// NodeToolRunEvent stream for one run_id. The stream ends after the EXITED
// event (or when the node disconnects). node_id identifies the owning node;
// run_id correlates the event stream the node is already producing.
message FollowToolRunRequest {
  string node_id = 1;
  string run_id = 2;
}

// Server -> node: one chunk of a host file upload. The node appends `data` to a
// temp file at `{path}.upload-{upload_id}.tmp` starting at `offset`; on the
// chunk with final=true it verifies total_size + sha256 and atomically renames
// to `path`. overwrite=false rejects an existing destination. Correlated by
// upload_id; the node cleans the temp file on failure or when a final never
// arrives within the host exec timeout window.
message NodeFileUploadRequest {
  string upload_id = 1;
  string path = 2;
  uint64 offset = 3;
  bytes data = 4;
  uint64 total_size = 5;
  string sha256 = 6;
  bool overwrite = 7;
  bool final = 8;
}

// Node -> server: per-chunk ack, correlated by upload_id. bytes_written is the
// cumulative bytes persisted to the temp file after this chunk. error is
// non-empty on any failure (path rejected, offset mismatch, checksum/size
// mismatch, atomic rename failed); the node drops the temp file and the caller
// must restart the upload with a fresh upload_id.
message NodeFileUploadResult {
  string upload_id = 1;
  bool ok = 2;
  uint64 bytes_written = 3;
  string path = 4;
  string error = 5;
}

// First upstream frame the node sends after dialing — BUT only after it has
// received the server's NodeServerHello (which carries the authoritative time
// the TOTP code is derived from). The node authenticates with a TOTP code
// computed over (secret, floor(server_time/30)); node_id is the durable
// identity minted at onboard. capabilities advertise what work it can accept.
message NodeRegister {
  string node_id = 1; // durable id assigned at onboard (replaces legacy token)
  string totp_code = 2; // 6-digit RFC 6238 code over the server-time step
  string node_name = 3; // display only; identity is node_id
  NodeCapabilities capabilities = 4;
  // role the node runs as. Empty/UNSPECIFIED is treated as an execution node
  // for backward compatibility. The server pins the authoritative role at
  // onboard time and ignores a mismatched self-report.
  NodeRole role = 5;
}

// NodeServerHello is the FIRST downstream frame the server sends immediately
// after the NodeConnect stream is established, before the node sends its
// NodeRegister. It carries the server's authoritative current time so the node
// can derive its TOTP code from the same clock the server will validate against
// (the node must NOT use its own local clock or public NTP). server_time is
// RFC3339Nano UTC.
//
// gateway_origin is the DATA service origin (scheme://host[:port]) that serves
// the MCP SSE gateway (/mcp/...). The node dials the CONTROL plane, which is a
// separate process/port that serves no MCP routes — so relative MCP spec URLs
// sent in session frames must resolve against this announced origin, NOT
// against the address the node dials. Empty (old control plane) → the node
// falls back to its own dial address.
message NodeServerHello {
  string server_time = 1;
  string gateway_origin = 2;
}

message EditorModeSemantics {
  bool can_read = 1;
  bool can_edit_workspace = 2;
  bool can_run_commands = 3;
  bool requires_approval = 4;
  bool network_access = 5;
}

message EditorModeSpec {
  string id = 1;
  string label = 2;
  map<string, string> native = 3;
  EditorModeSemantics semantics = 4;
  string source = 5;
}

message EditorCapability {
  string provider = 1;
  string version = 2;
  repeated EditorModeSpec modes = 3;
  bool supports_interactive = 4;
  bool supports_model_switch = 5;
  string probe_status = 6;
  string probe_error = 7;
  string probed_at = 8;
}

message NodeCapabilities {
  string os = 1; // e.g. "linux", "windows", "darwin"
  string arch = 2; // e.g. "amd64", "arm64"
  bool docker = 3; // can run the docker runtime (isolated)
  repeated string providers = 4; // installed provider CLIs: claude/codex/gemini/opencode
  map<string, string> labels = 5; // free-form capability labels for scheduling
  repeated EditorCapability editors = 6;
}

message NodePublicIPReport {
  uint64 config_revision = 1;
  string ipv4 = 2;
  string ipv6 = 3;
  string ipv4_resolved_at = 4;
  string ipv6_resolved_at = 5;
  bool ipv4_disabled = 6;
  bool ipv6_disabled = 7;
}

message NodeHeartbeat {
  string node_id = 1;
  repeated string active_session_ids = 2;
  NodePublicIPReport public_ip_report = 3;
  // Terminals still alive on this node. A host PTY outlives the control stream,
  // so after a reconnect (or a server restart) this is how the server learns
  // which terminals it can still reattach to instead of assuming they died.
  repeated string active_terminal_ids = 4;
  // Long-running tunnel client processes that survived a control-stream drop.
  repeated NodeActiveToolRun active_tool_runs = 5;
}

message NodePublicIPLookupConfig {
  uint64 revision = 1;
  repeated string ipv4_urls = 2;
  repeated string ipv6_urls = 3;
}

// Server -> node: persistent egress proxy the node uses for ALL GitHub
// downloads (self-upgrade, runtime-upgrade, and the install bootstrap's baked
// proxy when the node hasn't connected yet). Mirrors public_ip_lookup_config:
// a top-level downstream frame, singleton-backed, revision-gated on apply.
// An empty proxy_mode means "direct" (no proxy); the per-upgrade frame fields
// override this for a single upgrade when set, otherwise the node falls back
// to this persisted snapshot.
message NodeProxyConfig {
  uint64 revision = 1;           // per-node monotonic; bumped on every binding change
  string proxy_mode = 2;        // "" | "network" | "url_prefix"
  string proxy_url = 3;         // network: full http/https/socks5 URL with creds
  string proxy_url_prefix = 4;  // url_prefix: reverse-proxy base prepended to URL
  string proxy_config_id = 5;   // the bound pool-entry id echoed back ("" = direct)
}

message GetPublicIPLookupConfigRequest {}

message UpdatePublicIPLookupConfigRequest {
  repeated string ipv4_urls = 1;
  repeated string ipv6_urls = 2;
}

message GetNodeProxyConfigRequest {
  string node_id = 1;  // read this node's own egress-proxy binding
}

message UpdateNodeProxyConfigRequest {
  string proxy_config_id = 1;  // an entry id in the proxy pool; "" = direct
  string node_id = 2;          // bind the proxy to this node (per-node, not global)
}

// SetNodeLastProxy records the proxy used by a node's last *successful* upgrade
// (so the upgrade dialog can preselect it next time). Best-effort: called only
// after the upgrade RPC returns success; never on a failed dispatch.
message SetNodeLastProxyRequest {
  string node_id = 1;
  string proxy_config_id = 2;  // "" = the upgrade ran direct
}

message SetNodeLastProxyResponse {
  string node_id = 1;
  string last_proxy_config_id = 2;
}

// Server's reply to a successful NodeRegister. node_id is the durable identity
// the node uses on reconnect. server_time echoes the authoritative time the
// server validated the code against (the node can use it for skew diagnostics).
// online reflects the liveness dimension: a node is online once it has a live
// connection with a fresh heartbeat (separate from the approval status field).
message NodeRegistered {
  string node_id = 1;
  NodeStatus status = 2;
  string server_time = 3; // RFC3339Nano UTC, echo of the validated time
  bool online = 4; // liveness dimension (connection + fresh heartbeat)
}

// CreateSession downlink payload — the "下发参数包". The server sends intent and
// addresses; the node self-provisions (git clone, download skills/plugins, write
// provider config) locally. No file content is pushed.
message NodeCreateSession {
  string session_id = 1;
  string project_id = 2;
  string provider = 3; // editor type: claude/codex/gemini/opencode
  string model = 4;
  NodeGitSpec git = 5; // repo url + branch + create-branch
  NodeLLMConfig llm = 6; // pass-through LLM config from the caller
  repeated MCPServerSpec mcps = 7;
  repeated SkillSpec skills = 8;
  repeated NodePluginSpec plugins = 9;
  repeated EnvVarSpec env = 10;
  repeated VolumeMountSpec volumes = 11;
  map<string, string> tags = 12;
  string driver = 13; // "" / "docker" for the node to decide isolation
  string guest_image = 14; // docker driver only
  // interactive keeps the provider process running for multi-turn input
  // (agent-compose-runtime stream). When false the session runs a single
  // prompt turn and exits. Multi-turn currently supports the codex provider.
  bool interactive = 15;
  // mode selects the editor's permission/approval档位 (e.g. codex
  // read-only/workspace-write/danger-full-access, claude
  // default/plan/acceptEdits/bypassPermissions). Empty = the editor's default.
  // The value is a provider-native mode string validated server-side.
  string mode = 16;
  // defer_start controls the create→run coupling. Default (false) preserves the
  // backward-compatible behaviour: the node starts the editor immediately after
  // provisioning, using the config carried in this message. When true the
  // session stays provisioned until a StartSessionRuntime frame arrives, so the
  // server can apply split config (LLM/MCP/skills/plugins/mode) first.
  bool defer_start = 17;
  // Editor/session attribution is retained for mixed-version compatibility.
  string editor_id = 18;
  string editor_session_id = 19;
  // Stable product work-unit identity. Runtime session_id may be recreated while
  // this task_id continues to own the persistent workspace and audit history.
  string task_id = 20;
  // env_mode selects which HOME the editor runs against — the node's own user
  // home ("system"), a named shared environment on this node ("shared"), or a
  // throwaway per-session home ("isolated"). Empty = isolated, preserving the
  // existing behaviour for callers that do not set it.
  //
  // "system" hands the node operator's real home (ssh keys, CLI logins) to the
  // editor, so a node must opt into it explicitly; the node refuses the mode
  // otherwise. "shared" means concurrent sessions on the same env_id share one
  // HOME and can overwrite each other's CLI config — that is the point of the
  // mode, not a defect to lock against.
  string env_mode = 21;
  // env_id names the shared environment when env_mode is "shared"; ignored
  // otherwise. The node resolves it to a local directory itself — the server
  // stores only the id, never a node-local absolute path.
  string env_id = 22;
  // active_skills / active_plugins narrow which of the ENVIRONMENT's installed
  // resources this task actually turns on, by name. Empty means "everything the
  // environment has" (and is what non-shared tiers always send).
  //
  // This exists so removing a skill from one task cannot uninstall it from a
  // shared environment other tasks are using: installation is an environment
  // operation (NodeSyncEnvironment), activation is per session. The node passes
  // these names to the runtime's per-run --skill flags and never touches the
  // environment's files because of them.
  repeated string active_skills = 23;
  repeated string active_plugins = 24;
  // system_prompt is the platform-level task prompt the node writes to
  // stateRoot/agents/system-prompts/system-prompt.txt. The interactive runtime
  // re-reads that file every turn and splices it into the provider's
  // systemContext, so a server-side update takes effect on the next
  // human_message (hot-switch, no restart). Empty = no prompt injected.
  string system_prompt = 25;
}

// Git provisioning: the node clones locally. Supports creating a fresh working
// branch after clone (maps to GitWorkspaceConfig.CreateBranch/NewBranch).
message NodeGitSpec {
  string url = 1;
  string branch = 2; // existing branch/ref to check out
  string commit = 3;
  bool create_branch = 4; // git checkout -b after clone
  string new_branch = 5;
  string username = 6;
  string password = 7;
  string token = 8;
}

// Opaque pass-through LLM config supplied by the task creator. agent-compose
// does not interpret it beyond writing it into the provider's config; the
// external LLM service owns protocol translation and key lifecycle.
message NodeLLMConfig {
  string endpoint = 1;
  string api_key = 2;
  string model = 3;
  string protocol = 4; // optional wire hint: responses/chat/messages
  map<string, string> headers = 5; // extra headers if the provider needs them
  map<string, string> extra = 6; // free-form additional fields
}

message NodePluginSpec {
  string name = 1;
  string url = 2; // download address; node fetches it locally
  string version = 3;
}

// ---- Split session configuration payloads. Each carries a revision so the
// node can report which config version is on disk (applied_revision) vs. which
// the running editor actually loaded (effective_revision), and whether a
// restart is needed to make it live (restart_required in the ack). ----

// ConfigureSessionLLM points the session's editor DIRECTLY at an LLM service
// (no server-side proxy). The node writes the provider-specific config/env so
// the editor talks to endpoint with api_key; a custom key can route to any
// upstream model on the LLM service's side. Fields mirror NodeLLMConfig.
message ConfigureSessionLLM {
  string session_id = 1;
  uint64 revision = 2;
  NodeLLMConfig llm = 3;
}

// ApplySessionMCPs declares the FULL desired set of MCP servers for a session.
// The node rewrites the editor's managed MCP config block to exactly this set
// (empty clears it).
message ApplySessionMCPs {
  string session_id = 1;
  uint64 revision = 2;
  repeated MCPServerSpec mcps = 3;
}

// ApplySessionSkills declares the FULL desired set of skills. The node syncs
// them into the session skills dir (empty clears it).
message ApplySessionSkills {
  string session_id = 1;
  uint64 revision = 2;
  repeated SkillSpec skills = 3;
}

// ApplySessionPlugins declares the FULL desired set of plugins. The node
// fetches/installs them into the session plugins dir (empty clears it).
message ApplySessionPlugins {
  string session_id = 1;
  uint64 revision = 2;
  repeated NodePluginSpec plugins = 3;
}

// ConfigureSessionMode selects the editor's permission/approval mode. mode is
// the provider-native mode string (validated server-side against the provider's
// allowed values); the node passes it through to the runtime.
message ConfigureSessionMode {
  string session_id = 1;
  uint64 revision = 2;
  string mode = 3;
}

// StartSessionRuntime starts the editor runtime for a session created without
// auto-start (config applied first). No-op if already running.
message StartSessionRuntime {
  string session_id = 1;
}

// RestartSessionRuntime stops the current editor process and starts it again
// against the latest applied config. fresh=false keeps provider state/context;
// fresh=true resets runtime conversation state while preserving workspace,
// HOME/provider config, skills/plugins, and MCP config.
message RestartSessionRuntime {
  string session_id = 1;
  bool fresh = 2;
}

// CollectSessionArtifacts asks the node to package the session working tree and
// make it available for the server to pull back through the tunnel. path
// optionally scopes to a subdir (empty = whole workspace).
message CollectSessionArtifacts {
  string session_id = 1;
  string path = 2;
}

message NodeDeleteSession {
  string session_id = 1;
}

message NodeListSessions {
  string request_id = 1;
}

// NodeSessionInput carries a multi-turn input frame for an interactive session
// (driver runtime "stream" mode). The server relays caller input (a new prompt
// turn, or an end-of-input signal) to the node, which writes it to the running
// agent-compose-runtime stream process's stdin. kind selects the frame:
// "human_message" delivers text as the next turn; "eof" ends the conversation;
// "cancel" aborts the current turn.
//
// For "human_message" the frame also carries a snapshot of the session's
// current runtime config (model/mode/llm). The node stamps this on the frame
// before writing it to the runtime's stdin, so the runtime re-prepares the
// provider with the latest config on every turn instead of relying on a
// separate hot-update protocol. This is what makes config changes
// (model/mode/MCP/skill/plugin) take effect on the next turn with no restart.
message NodeSessionInput {
  string session_id = 1;
  string kind = 2; // human_message | eof | cancel
  string text = 3; // message body for human_message
  string model = 4; // per-turn model snapshot
  string mode = 5; // per-turn permission/approval mode snapshot
  NodeLLMConfig llm = 6; // per-turn LLM endpoint/key/protocol snapshot
  // End-to-end user-message idempotency key. The execution node/runtime ACK it
  // via a structured input_received event and drop same-id replays.
  string client_message_id = 7;
  // Which execution attempt of that message this frame is. Retries of a
  // failed/cancelled turn bump the attempt; transport replays reuse it.
  // Dedupe key = (client_message_id, delivery_attempt).
  uint32 delivery_attempt = 8;
}

// NodeCreateExecutionNode: server → management node. Tells the management node
// to launch an execution node on its host. The management node runs the
// appropriate mechanism (docker run / docker compose up / systemctl) with the
// server address + node_id + TOTP secret baked in; the launched execution node
// then dials the server and authenticates with a TOTP code. The management node
// does not sit in the launched node's data path.
message NodeCreateExecutionNode {
  string launch_id = 1; // management-node-local handle for later teardown
  string server_url = 2; // server address the launched node should dial
  string node_id = 3; // durable id minted for the new node at onboard
  string secret = 9; // TOTP secret (base32) the launched node authenticates with
  NodeStartupMethod startup_method = 4; // how to launch it on this host
  string node_name = 5; // desired name for the launched node
  string guest_image = 6; // container image for docker/docker-compose methods
  repeated EnvVarSpec env = 7; // extra env for the launched node process
  map<string, string> labels = 8; // capability labels to pass through
}

message NodeDeleteExecutionNode {
  string launch_id = 1;
}

// SendSessionInputRequest is the server-side unary API for relaying a turn into
// an interactive session. The model/mode/llm fields let the caller pass the
// session's latest config snapshot so the turn executes under current config;
// when left empty the node fills them from its own session mirror.
message SendSessionInputRequest {
  string session_id = 1;
  string kind = 2;
  string text = 3;
  string model = 4;
  string mode = 5;
  NodeLLMConfig llm = 6;
  // Echoed into NodeSessionInput; see that message.
  string client_message_id = 7;
  uint32 delivery_attempt = 8;
}

message SendSessionInputResponse {
  bool accepted = 1;
  string error = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Reverse-proxy tunnel (phase 4)
//
// The server exposes session-local HTTP services (jupyter, a files endpoint,
// arbitrary ports) by reverse-proxying over the node's already-established
// NodeConnect stream — the node dials out, so the server cannot connect inward.
// A tunnel is one HTTP request/response exchange, correlated by tunnel_id and
// multiplexed over the single bidi stream alongside session commands.
// ─────────────────────────────────────────────────────────────────────────────

// NodeTunnelRequest: server → node. Asks the node to forward one HTTP request to
// a session-local service and stream the response back.
message NodeTunnelRequest {
  string tunnel_id = 1;
  string session_id = 2;
  string service = 3; // logical target on the node: "jupyter" | "files" | port name
  string method = 4;
  string path = 5; // request path + optional query
  map<string, string> headers = 6;
  bytes body = 7;
  bool body_complete = 8; // false if more request-body chunks follow (streaming upload)
}

// NodeTunnelResponse: node → server. The node's forwarded HTTP response, sent as
// one or more frames (headers first, then body chunks, then done).
message NodeTunnelResponse {
  string tunnel_id = 1;
  int32 status = 2; // set on the first frame (headers)
  map<string, string> headers = 3; // set on the first frame
  bytes body = 4; // body chunk (may be empty)
  bool done = 5; // true on the final frame
  string error = 6; // non-empty if the node failed to reach the local service
}

// Streamed session output the node buffers locally and flushes back in order.
// offset lets the server dedupe/resume after a reconnect (the local queue is
// FIFO; offset is the byte anchor, mirroring appendProjectRunLogChunk).
message NodeSessionOutput {
  string session_id = 1;
  bytes data = 2;
  StdioStream stream = 3;
  uint64 offset = 4;
  string created_at = 5;
}

message NodeSessionResult {
  string session_id = 1;
  int32 exit_code = 2;
  bool success = 3;
  string error = 4;
  string result_json = 5;
}

// Progress of a session's preparation, reported per step as the node works
// through it.
//
// Why this exists: session creation used to be a black box. The node prepared
// the workspace, cloned the repo, resolved the agent runtime and started it all
// inside one call, and reported only a single pass/fail at the end. When a task
// failed to start, neither the operator nor the user could tell *which* step
// broke — "exit code 1" is the same answer for "the repo is unreachable" and
// "the runtime is not installed". These frames make each step observable, so a
// failure names its own phase.
//
// Ordering is the natural execution order (see SessionStage). Every stage that
// runs emits exactly one frame: ok=true on success, ok=false with `error` set on
// failure — after which no further stage frames arrive for that session. Frames
// are advisory: the server persists them for display, and a node that never
// sends them (older build) still works, it just cannot say where it stopped.
message NodeSessionStage {
  string session_id = 1;
  SessionStage stage = 2;
  bool ok = 3;
  // Human-readable detail for this step: on success a short note ("cloned
  // branch main"), on failure the underlying reason. Never carries credentials —
  // the node redacts URL userinfo before filling this in.
  string detail = 4;
  // Set only when ok=false: the error that stopped this stage.
  string error = 5;
  string created_at = 6;
}

// The preparation steps of a session, in execution order.
enum SessionStage {
  SESSION_STAGE_UNSPECIFIED = 0;
  // Creating the session's working/runtime/home directories.
  SESSION_STAGE_WORKSPACE_PREPARE = 1;
  // Cloning (or reusing) the bound git repository into the working tree.
  SESSION_STAGE_GIT_CLONE = 2;
  // Verifying the node can actually launch the agent runtime before trying.
  SESSION_STAGE_RUNTIME_PREFLIGHT = 3;
  // Spawning the provider/runtime process.
  SESSION_STAGE_RUNTIME_START = 4;
  // The runtime is up and the session is live.
  SESSION_STAGE_RUNNING = 5;
  // Writing the session's LLM/MCP config and downloading the skills + plugins
  // it was granted. Numbered after RUNNING because enum values are wire
  // identifiers and may never be renumbered; display order is defined
  // server-side (task_service._RUNTIME_STAGES), where it sits between the clone
  // and the pre-flight — which is where it actually runs.
  SESSION_STAGE_RESOURCE_SYNC = 6;
}

// Ack for a downstream command (create/delete/list), correlated by the
// server_frame_id the node received.
message NodeCommandAck {
  string server_frame_id = 1;
  bool ok = 2;
  string error = 3;
  repeated NodeSessionSummary sessions = 4; // populated for ListSessions acks
  // ---- Config-command acks (Configure*/Apply*/Mode). ----
  // applied_revision is the config revision the node just persisted to disk for
  // the target session. effective_revision is the revision the currently running
  // editor process actually loaded (0/empty when nothing is running yet).
  // restart_required is true when applied_revision is newer than
  // effective_revision, i.e. the change is on disk but the running editor must be
  // restarted (RestartSessionRuntime) for it to take effect.
  uint64 applied_revision = 5;
  uint64 effective_revision = 6;
  bool restart_required = 7;
  // ---- ManageEditor acks. ----
  // Version string the node probed after a successful install/upgrade (e.g.
  // "1.2.3"). Empty when the command failed or the frame was not ManageEditor.
  string editor_version = 8;
  // ---- InspectEnvironment ack. ----
  // What the node observed physically installed in an environment HOME. Empty
  // for non-inspect acks. MCP never appears here (it is config, not on disk).
  repeated NodeEnvironmentEntry environment_inventory = 9;
  // ---- InspectSystemEnv / SyncSystemEnv acks. ----
  // What the node observed in the OPERATOR's HOME (system env). Inspect fills it
  // with the whole inventory; a sync ack fills it with the entries it just
  // installed/skipped/removed so the caller can report per-entry outcomes
  // without a second round trip. Unlike environment_inventory this DOES include
  // MCP entries (read from the provider MCP config), because the point is to
  // show what a system-env session actually gets.
  repeated NodeSystemEnvEntry system_env_inventory = 10;
  // ---- InstallHostTool acks. ----
  // Probed Node.js / npm versions after a successful host-tool install. Empty
  // when the command failed or the ack was not from an install. The server folds
  // these straight into the node's capability labels so listings refresh without
  // waiting for a re-register.
  string node_version = 11;
  string npm_version = 12;
  // Probed xcodebuild version after a successful "xcode" host-tool DETECTION.
  // Unlike nodejs there is no install — the ack's whole payload is this version,
  // so the operator's click refreshes the xcodebuild_version capability label
  // immediately and the build tab can pick the node without a node restart.
  // Empty for nodejs acks, failed detections, or nodes built before this field
  // (older nodes never set it; the frontend then falls back to restart guidance).
  string xcodebuild_version = 13;
  // ---- RefreshLabels acks. ----
  // The node's full capability snapshot, freshly probed (os/arch/docker/
  // providers/editors/labels) — the same shape the node registers with. The
  // server folds it into the node's stored capabilities so the console updates
  // without a node restart. Empty for older nodes (they reject unknown
  // downstream frames server-side; the caller surfaces that as an error).
  NodeCapabilities refreshed_capabilities = 14;
}

message NodeSessionSummary {
  string session_id = 1;
  string project_id = 2;
  string provider = 3;
}

message NodeError {
  string code = 1;
  string message = 2;
  bool terminal = 3;
}

message ListNodesRequest {
  NodeStatus status = 1; // optional filter; UNSPECIFIED returns all
}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

message NodeInfo {
  string node_id = 1;
  string node_name = 2;
  NodeStatus status = 3;
  NodeCapabilities capabilities = 4;
  string connected_at = 5;
  string last_heartbeat_at = 6;
  bool connected = 7;
  repeated string active_session_ids = 8;
  NodeRole role = 9;
  NodeStartupMethod startup_method = 10;
  string manager_node_id = 11; // set for nodes launched by a management node
  // online is the liveness dimension (distinct from approval status): true when
  // the node currently has a live connection with a heartbeat newer than the
  // timeout. A node can be approved but offline.
  bool online = 12;
  NodeCapacity capacity = 13;
  // proxy_config_id is this node's bound egress-proxy pool entry ("" = direct).
  // The admin picks one at onboard time or on the node detail page; the server
  // pushes the resolved snapshot to the node and bakes it into the install
  // script. Per-node, NOT a global singleton.
  string proxy_config_id = 14;
  // last_proxy_config_id is the proxy used by this node's last *successful*
  // upgrade; the upgrade dialog preselects it (the admin can keep/change/direct).
  string last_proxy_config_id = 15;
}

message NodeCapacity {
  int32 max_sessions = 1;
  double cpu_total = 2;
  int64 memory_total = 3;
}

message SetNodeCapacityRequest {
  string node_id = 1;
  NodeCapacity capacity = 2;
}

message SetNodeCapacityResponse {
  string node_id = 1;
  NodeCapacity capacity = 2;
}

message MoveNodeRequest {
  string node_id = 1;
  string manager_node_id = 2;
