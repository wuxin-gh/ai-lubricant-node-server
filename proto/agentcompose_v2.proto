message HostFileUploadRequest {
  string node_id = 1;
  string upload_id = 2;
  string path = 3;
  uint64 offset = 4;
  bytes data = 5;
  uint64 total_size = 6;
  string sha256 = 7;
  bool overwrite = 8;
  bool final = 9;
}

// NodeService -> client: per-chunk ack forwarded from the node daemon.
message HostFileUploadResponse {
  string upload_id = 1;
  bool ok = 2;
  uint64 bytes_written = 3;
  string path = 4;
  string error = 5;
}

message ApproveNodeRequest {
  string node_id = 1;
}

message ApproveNodeResponse {
  NodeInfo node = 1;
}

message RevokeNodeRequest {
  string node_id = 1;
}

message RevokeNodeResponse {
  NodeInfo node = 1;
}

message DeleteNodeRequest {
  string node_id = 1;
  // force permits deleting a node that is currently online (connected). Without
  // it an online node is refused so an operator does not yank a node mid-work by
  // accident. A management node that still owns execution nodes is always
  // refused regardless of force.
  bool force = 2;
}

message DeleteNodeResponse {
  bool deleted = 1;
}

message OnboardNodeRequest {
  NodeRole role = 1; // execution (default) | management
  NodeStartupMethod startup_method = 2; // selects the install script handed back
  string node_name = 3; // optional desired name
  map<string, string> labels = 4; // optional capability labels
  // manager_node_id names the management node this execution node is owned by.
  // REQUIRED for the execution role: it must name an existing management node
  // (which may be a passive one created purely as an ownership container — see
  // OnboardNode for the management role). An empty or non-management id is
  // rejected; there is no implicit fallback owner. Ignored for the management
  // role. The server pins ownership at onboard time; the execution node cannot
  // choose or change its owner (prevents horizontal privilege escalation).
  string manager_node_id = 5;
  // proxy_config_id names the proxy-pool entry this node uses for GitHub
  // downloads (self-upgrade / runtime-upgrade / install bootstrap). "" = direct.
  // Picked by the admin at onboard; can be changed later on the node detail
  // page. Per-node binding; "" falls back to direct.
  string proxy_config_id = 6;
}

message OnboardNodeResponse {
  string node_id = 1; // the pending node's durable id
  // secret is the node's TOTP secret (base32), shown ONCE at onboard. The node
  // is provisioned with node_id + secret and derives a TOTP code from it on
  // every connect; the server stores only an encrypted copy. There is no
  // one-time token anymore — the (node_id, secret) pair is the durable identity.
  string secret = 2;
  // install_command is a ready-to-paste shell command that runs the install
  // script with node_id + secret injected via the environment (kept out of
  // argv/URL). script_url is the raw script endpoint.
  string install_command = 3;
  string script_url = 4;
  NodeInfo node = 5;
  // otpauth_uri is a standard otpauth:// provisioning URI (base32 secret) so an
  // operator can, if they want, load the same secret into an authenticator app.
  string otpauth_uri = 7;
  // launched is true when the resolved owner is a real, connected management
  // node that the server told to launch this execution node itself. When false
  // the operator runs install_command by hand (synthetic/offline manager).
  bool launched = 6;
}

message RevokeOnboardNodeRequest {
  string node_id = 1;
}

message RevokeOnboardNodeResponse {
  bool deleted = 1; // true if the pending record was removed (never registered)
  bool revoked = 2; // true if an already-registered node was revoked instead
  NodeInfo node = 3; // populated when revoked (record retained for audit)
}

// DispatchSessionRequest places a session on a node. If node_id is empty the
// server selects an approved, connected node (phase-1: first eligible). The
// session payload is the CreateSession "下发参数包"; session_id may be empty to
// have the server mint one.
message DispatchSessionRequest {
  string node_id = 1;
  NodeCreateSession session = 2;
}

message DispatchSessionResponse {
  string session_id = 1;
  string node_id = 2;
  bool accepted = 3;
  string error = 4;
}

// ── Split-config control request/response. Each request names the session
// (the server routes to its owning node); the LLM is the server's chance to
// map a custom key/model. NodeSessionConfigAck echoes the node's config ack. ──

message ConfigureNodeSessionLLMRequest {
  string session_id = 1;
  NodeLLMConfig llm = 2;
}

message ApplyNodeSessionMCPsRequest {
  string session_id = 1;
  repeated MCPServerSpec mcps = 2;
}

message ApplyNodeSessionSkillsRequest {
  string session_id = 1;
  repeated SkillSpec skills = 2;
}

message ApplyNodeSessionPluginsRequest {
  string session_id = 1;
  repeated NodePluginSpec plugins = 2;
}

message ConfigureNodeSessionModeRequest {
  string session_id = 1;
  string mode = 2;
}

message StartNodeSessionRuntimeRequest {
  string session_id = 1;
}

message RestartNodeSessionRuntimeRequest {
  string session_id = 1;
  bool fresh = 2;
}

message CollectNodeSessionArtifactsRequest {
  string session_id = 1;
  string path = 2;
}

// NodeSessionConfigAck is the client-facing projection of the node's
// NodeCommandAck for a config command: whether it was accepted, the revision
// the node persisted, the revision currently live in the editor, and whether a
// runtime restart is required to make the applied config effective.
message NodeSessionConfigAck {
  bool ok = 1;
  string error = 2;
  uint64 applied_revision = 3;
  uint64 effective_revision = 4;
  bool restart_required = 5;
}

message DeleteNodeSessionRequest {
  string session_id = 1;
}

message DeleteNodeSessionResponse {
  bool deleted = 1;
  string error = 2;
}

message FollowNodeSessionRequest {
  string session_id = 1;
}

// NodeSessionEvent is the server-stream projection of a dispatched session's
// upstream frames: interleaved output chunks, structured events, and a terminal
// result.
message NodeSessionEvent {
  oneof event {
    NodeSessionOutput output = 1;
    NodeSessionResult result = 2;
    // Structured event parsed from the runtime NDJSON stream (tool call,
    // reasoning, progress, todo, file change, per-agent status). Additive
    // alongside the raw output byte stream.
    NodeSessionEventStructured structured = 3;
  }
}

// NodeSessionEventStructured is a single structured event the node parsed from
// the runtime's NDJSON output. It is intentionally schema-light: event_type and
// item_type carry the runtime's own vocabulary (agent_event/agent_turn_completed,
// item.type = agent_message/reasoning/command_execution/mcp_tool_call/
// file_change/todo_list/web_search/…), and payload_json carries the raw event
// object so the server/UI can render specifics without the node needing to model
// every provider's schema. agent_id is reserved for per-subagent attribution
// (populated when the provider surfaces subagent events; empty otherwise).
message NodeSessionEventStructured {
  string session_id = 1;
  uint64 seq = 2; // runtime frame seq, monotonic per session
  string event_type = 3; // runtime frame type: agent_event/agent_turn_completed/result/error
  string item_type = 4; // for agent_event: the item.type (agent_message/reasoning/…)
  string agent_id = 5; // per-subagent attribution; empty for the root agent
  string payload_json = 6; // raw event object as JSON
  string created_at = 7; // RFC3339Nano UTC when the node observed it
  // Canonical additive envelope. Legacy event_type/item_type/agent_id remain
  // for compatibility; consumers should use these explicit fields when set.
  string logical_event_id = 8;
  string event_name = 9;
  string event_kind = 10;
  string tool_name = 11;
  string subagent_id = 12;
  string phase = 13;
  string status = 14;
}

// ═══════════════════════════════════════════════════════════════════════════════
// Node forward HTTP proxy (node mode).
// The server wants a channel/API request to exit from the node's IP. It sends
// the node one NodeProxyRequest describing the full HTTP request (method, url,
// headers, body); the node performs the outbound request itself (so TLS is
// terminated on the node, with the node's own HTTP client) and streams the
// response back as NodeTunnelResponse frames, multiplexed over the NodeConnect
// stream by tunnel_id (reusing the reverse-proxy response so the dispatch path
// is shared). The node applies no business logic — it is a pure I/O relay.
// ───────────────────────────────────────────────────────────────────────────────

// Server -> node: perform one HTTP request to an absolute URL.
message NodeProxyRequest {
  string tunnel_id = 1;
  string method = 2;
  string url = 3;                    // absolute URL (https://api.example.com/v1/…)
  map<string, string> headers = 4;
  bytes body = 5;
  bool body_complete = 6;            // false if more request-body chunks follow (streaming upload)
}

// ─── iOS host management ───────────────────────────────────────────────────
//
// An ios_host node drives N physical iPhones over go-ios (USB or LAN) and
// speaks WebDriverAgent to each. These frames are the *host management* plane:
// device discovery, adoption, per-device config, and the WDA build/sign/install
// jobs. They deliberately do NOT touch the device-control v0 protocol — each
// adopted iPhone still gets its own device-control WebSocket and its own
// credential, exactly like an Android device, so the wire the server sees for
// UI commands is unchanged.
//
// Gating: the server only sends these to a node whose registration labels carry
// ios_mgmt=true. An older node-ios logs-and-drops unknown frames, and an older
// server simply never sends them, so both directions degrade safely.

// Server -> node: re-enumerate attached iPhones. Acked with NodeCommandAck; the
// inventory itself arrives as a NodeIosDevicesReport.
message NodeIosDiscover {
  string request_id = 1;
}

// IosConnectionType mirrors go-ios's device ConnectionType, which is how a host
// distinguishes a USB-tethered iPhone from one reachable over LAN WiFi.
enum IosConnectionType {
  IOS_CONNECTION_TYPE_UNSPECIFIED = 0;
  IOS_CONNECTION_TYPE_USB = 1;
  IOS_CONNECTION_TYPE_NETWORK = 2;
}

// IosWdaState is the lifecycle of WebDriverAgent on one device, as observed by
// the host. This is deliberately separate from "device online": a device can be
// physically present with no WDA installed, or have a ready WDA whose
// provisioning profile expires next week.
enum IosWdaState {
  IOS_WDA_STATE_UNSPECIFIED = 0;
  // No signed WDA runner installed (or the host cannot see one).
  IOS_WDA_STATE_MISSING = 1;
  // A WDA job is currently working on this device.
  IOS_WDA_STATE_PREPARING = 2;
  // Runner installed, launched, port forwarded, /status answering, session OK.
  IOS_WDA_STATE_READY = 3;
  // Ready, but the provisioning profile expires soon (renewal window).
  IOS_WDA_STATE_RENEWAL_DUE = 4;
  // The provisioning profile has expired; the runner will not launch.
  IOS_WDA_STATE_EXPIRED = 5;
  // The last WDA job or launch attempt failed; last_error carries why.
  IOS_WDA_STATE_FAILED = 6;
}

// One physically discovered iPhone as the host sees it. Everything here is
// observed on the host — the server never asks a user to type a UDID.
message NodeIosDevice {
  string udid = 1;
  string name = 2;                        // device name as set by its owner
  string model = 3;                       // hardware model identifier
  string product_version = 4;             // iOS version
  IosConnectionType connection_type = 5;
  // present is false for a device the host knows about (claimed, credential on
  // disk) but which is currently unplugged / off the network.
  bool present = 6;
  // claimed is true once this host holds a device-control credential for the
  // UDID; device_id is the server-side device identity in that case.
  bool claimed = 7;
  string device_id = 8;
  // Whether the device-control WebSocket for this device is currently up. A
  // claimed+present device can still be offline (revoked token, WDA down).
  bool device_control_online = 9;
  IosWdaState wda_state = 10;
  string wda_bundle_id = 11;
  // RFC3339 expiry of the signing profile backing the installed WDA, when the
  // host could parse it; empty when unknown.
  string profile_expires_at = 12;
  string last_error = 13;
  // Which NodeIosConfigureDevice revision this device is actually running.
  int64 config_revision_applied = 14;
  // Whether the device has Developer Mode enabled (iOS 16+). A false value with
  // present=true is the most common reason WDA cannot be launched.
  bool developer_mode_enabled = 15;
}

// Node -> server: the host's full device inventory. Always a complete snapshot
// (not a delta) so a reconnecting server converges in one frame; snapshot_revision
// increases monotonically per host so an out-of-order delivery is detectable.
message NodeIosDevicesReport {
  string request_id = 1;                  // echoes NodeIosDiscover, empty when unsolicited
  int64 snapshot_revision = 2;
  string reported_at = 3;                 // RFC3339
  repeated NodeIosDevice devices = 4;
  // Host-level diagnostics: set when the host cannot enumerate at all (usbmuxd
  // not running, Apple Devices service missing on Windows, …). devices is then
  // empty and the UI must say "cannot see devices", not "no devices".
  string enumerate_error = 5;
}

// Server -> node: adopt one discovered iPhone.
//
// The pairing_code is a one-time device-control code the server just minted; the
// host redeems it over plain HTTP (the same endpoint the Android app uses) and
// stores the resulting long-lived token in a 0600 file. Sending the code — not
// the token — keeps the credential-minting path identical for every device
// platform and means this frame carries no long-lived secret.
message NodeIosClaimDevice {
  string request_id = 1;
  string udid = 2;
  string device_label = 3;                // human label; defaults to the device name
  string pairing_code = 4;
  string server_url = 5;                   // device-control base URL to redeem against
  string transport = 6;                    // "usb" | "network"
  // Optional WDA identity to store with the device up front, so a later job has
  // it without a second round trip. Empty is fine: the WDA job carries its own.
  string wda_bundle_id = 7;
  string xctest_config_name = 8;
  int64 config_revision = 9;
}

// Server -> node: stop driving a device.
message NodeIosReleaseDevice {
  string request_id = 1;
  string device_id = 2;
  string udid = 3;
  // Delete the local 0600 credential too. False keeps it so the device can be
  // resumed without re-pairing (used for a temporary disable).
  bool delete_credential = 4;
  // Also uninstall the WDA runner from the device. Off by default: the runner is
  // expensive to re-sign and harmless to leave installed.
  bool uninstall_wda = 5;
}

// Server -> node: desired per-device configuration. Revision-gated.
message NodeIosConfigureDevice {
  string request_id = 1;
  string device_id = 2;
  string udid = 3;
  int64 config_revision = 4;
  string transport = 5;                    // "usb" | "network"
  string wda_bundle_id = 6;
  string xctest_config_name = 7;
  // Pin the host-side forwarded port. 0 (recommended) lets the host allocate a
  // free port per device, which is what makes many iPhones on one host safe.
  int32 host_wda_port = 8;
  // Whether the host may start a WDA job on its own (e.g. after detecting an
  // expired profile) instead of waiting for a server-scheduled job.
  bool auto_prepare = 9;
  // Renewal window: report RENEWAL_DUE this many days before profile expiry.
  int32 renew_before_days = 10;
}

// IosWdaJobAction selects what a WDA job should do. Each action is a prefix of
// the full pipeline, so PREPARE implies download+sign+install+launch+verify.
enum IosWdaJobAction {
  IOS_WDA_JOB_ACTION_UNSPECIFIED = 0;
  // Full first-time setup: fetch artifact, sign, install, launch, verify.
  IOS_WDA_JOB_ACTION_PREPARE = 1;
  // Re-sign with a fresh profile and reinstall, keeping the same artifact.
  // Used for the 7-day (free) / yearly (paid) profile expiry.
  IOS_WDA_JOB_ACTION_RENEW = 2;
  // Reinstall the already-signed artifact (recover a deleted/broken runner).
  IOS_WDA_JOB_ACTION_REINSTALL = 3;
  // Install a signed IPA the user supplied themselves (free Apple ID path,
  // where automated signing is impossible). No signing stage runs.
  IOS_WDA_JOB_ACTION_INSTALL_SIGNED = 4;
}

// IosSigningMode selects where the signing identity comes from.
enum IosSigningMode {
  IOS_SIGNING_MODE_UNSPECIFIED = 0;
  // App Store Connect API key (paid Apple Developer Program). The host
  // registers the UDID, provisions a profile and signs — fully automatable,
  // including renewal.
  IOS_SIGNING_MODE_APP_STORE_CONNECT = 1;
  // Caller-supplied p12 + mobileprovision. The host only signs; obtaining and
  // renewing the profile is the operator's job.
  IOS_SIGNING_MODE_MANUAL_P12 = 2;
  // The artifact is already signed; the host only installs it. This is the only
  // supported free-Apple-ID path — Apple exposes no API to automate it.
  IOS_SIGNING_MODE_PRESIGNED = 3;
}

// Signing material for one job.
//
// SECURITY: these are high-value credentials. They travel only over the
// authenticated NodeConnect stream (never a user-facing API), are written 0600
// on the host, and must never appear in job events, logs or acks. The server
// stores them in its secret store and sends them per job rather than letting
// the host hold them indefinitely.
message NodeIosSigningMaterial {
  IosSigningMode mode = 1;
  // App Store Connect API key (mode = APP_STORE_CONNECT).
  string asc_key_id = 2;
  string asc_issuer_id = 3;
  bytes asc_private_key = 4;               // the .p8 contents
  // Reuse an existing certificate instead of creating one. Apple allows only
  // one current iOS Development certificate per account, so a fleet must share
  // it: the first job creates it, later jobs pass its id here and mint only a
  // per-device profile.
  string certificate_id = 5;
  bytes certificate_p12 = 6;               // the P12 matching certificate_id
  string p12_password = 7;
  // Pre-provisioned profile (mode = MANUAL_P12).
  bytes provisioning_profile = 8;
}

// The WDA artifact to install. The server resolves an approved artifact to a
// URL + digest; the host downloads and verifies before touching the device, so
// a node never installs an unpinned third-party binary.
message NodeIosWdaArtifact {
  string artifact_id = 1;
  string url = 2;
  string sha256 = 3;
  int64 size_bytes = 4;
  string version = 5;
  // Bundle id to give the signed runner. Free/dev signing cannot reuse another
  // team's bundle id, so a per-team id is rewritten in at signing time.
  string target_bundle_id = 6;
  string xctest_config_name = 7;
}

// Server -> node: run one WDA job.
message NodeIosWdaJobRequest {
  string job_id = 1;
  string request_id = 2;
  string device_id = 3;
  string udid = 4;
  IosWdaJobAction action = 5;
  NodeIosWdaArtifact artifact = 6;
  NodeIosSigningMaterial signing = 7;
  int64 config_revision = 8;
  // Reinstall even when the host believes the runner is already present.
  bool force = 9;
  // Try to enable Developer Mode on the device as part of the job. The device
  // still shows a confirmation prompt and reboots, so this cannot be silent.
  bool enable_developer_mode = 10;
}

// Server -> node: cancel a job at the next stage boundary.
message NodeIosJobCancel {
  string request_id = 1;
  string job_id = 2;
}

// IosJobStage names the pipeline step a job is in. The server renders these
// verbatim, so a stuck job says which step is stuck instead of "preparing".
enum IosJobStage {
  IOS_JOB_STAGE_UNSPECIFIED = 0;
  IOS_JOB_STAGE_QUEUED = 1;
  IOS_JOB_STAGE_DOWNLOADING = 2;
  IOS_JOB_STAGE_VERIFYING = 3;            // sha256 + archive/bundle shape
  IOS_JOB_STAGE_ENABLING_DEVELOPER_MODE = 4;
  IOS_JOB_STAGE_ENSURING_DEVICE = 5;      // register UDID with Apple
  IOS_JOB_STAGE_ENSURING_BUNDLE_ID = 6;
  IOS_JOB_STAGE_PREPARING_CERTIFICATE = 7;
  IOS_JOB_STAGE_CREATING_PROFILE = 8;
  IOS_JOB_STAGE_SIGNING = 9;
  IOS_JOB_STAGE_INSTALLING = 10;
  IOS_JOB_STAGE_MOUNTING_DEVELOPER_IMAGE = 11;
  IOS_JOB_STAGE_STARTING_RUNNER = 12;
  IOS_JOB_STAGE_FORWARDING_PORT = 13;
  IOS_JOB_STAGE_WAITING_READY = 14;       // polling WDA /status
  IOS_JOB_STAGE_VERIFYING_CONTROL = 15;   // session + source smoke test
  IOS_JOB_STAGE_COMPLETED = 16;
  IOS_JOB_STAGE_FAILED = 17;
  IOS_JOB_STAGE_CANCELLED = 18;
}

// Node -> server: one progress step of a WDA job.
//
// message/detail are operator-facing text and MUST be free of signing material.
message NodeIosJobEvent {
  string job_id = 1;
  int64 seq = 2;                           // monotonic per job
  IosJobStage stage = 3;
  string message = 4;
  // 0-100 where the stage can estimate it (download), else 0.
  int32 percent = 5;
  string reported_at = 6;                  // RFC3339
  // Redacted tail of whatever external tool this stage ran (runner log, Apple
  // API error). Bounded by the host.
  string log_tail = 7;
}

// Node -> server: terminal outcome of a WDA job. Sent exactly once per job.
message NodeIosJobResult {
  string job_id = 1;
  bool ok = 2;
  // Stable machine code for the UI to branch on: "sha256_mismatch",
  // "asc_unauthorized", "developer_mode_required", "device_not_present",
  // "profile_expired", "install_failed", "runner_failed", "wda_unreachable",
  // "cancelled", …
  string error_code = 3;
  string error_message = 4;
  // Whether retrying the same job could plausibly succeed (transient network /
  // device asleep) versus needing operator action (bad credentials).
  bool retryable = 5;
  IosJobStage stage_reached = 6;
  // On success: what is now installed and until when it is valid.
  string wda_bundle_id = 7;
  string profile_expires_at = 8;           // RFC3339
  string artifact_sha256 = 9;
  string artifact_version = 10;
  // The certificate the job used/created, so later per-device jobs can reuse it
  // instead of tripping Apple's one-certificate-per-account limit.
  string certificate_id = 11;
  int64 config_revision = 12;
}



// ─── Generic node build pipeline ────────────────────────────────────────────
//
// One build = clone a pinned source + exec an ordered step list + glob one
// artifact + upload it to a one-time server endpoint. The server renders the
// steps (recipe semantics live server-side); the node is a dumb, sandboxed
// executor so the same frame serves any toolchain.

// Server -> node: run one build.
message NodeBuildRequest {
  string build_id = 1;
  // Recipe identity for logging/UI only; the node does not interpret it.
  string recipe_kind = 2;                  // "xcode_wda", "docker_image", …
  string source_url = 3;                    // git URL, pinned by source_ref
  string source_ref = 4;                    // commit SHA or tag
  // Ordered shell commands executed in the workspace root. The node does not
  // parse them — each runs via the platform shell, output is captured (bounded)
  // and streamed as NodeBuildEvent.
  repeated string steps = 5;
  // Single glob relative to the workspace root matching the artifact to
  // upload. First match wins.
  string artifact_glob = 6;
  // One-time upload endpoint + token (bound to build_id, short TTL). The node
  // POSTs the artifact directly here so large binaries never ride the
  // NodeConnect control stream.
  string upload_url = 7;
  string upload_token = 8;
  // Whole-build budget; the node cancels at the step boundary when exceeded.
  int64 timeout_seconds = 9;
  string artifact_name = 10;
  string artifact_version = 11;
}

// Server -> node: cancel a running build at the next stage boundary.
message NodeBuildCancel {
  string build_id = 1;
}

// Node -> server: one progress step of a build. stage ∈
// cloning/building/packaging/uploading (free-form; the UI renders verbatim).
message NodeBuildEvent {
  string build_id = 1;
  int64 seq = 2;                            // monotonic per build
  string stage = 3;
  string message = 4;
  int32 percent = 5;                        // 0-100 where estimable, else 0
  string reported_at = 6;                   // RFC3339
  // Bounded, redacted tail of the current step's output (diagnostics).
  string log_tail = 7;
}

// Node -> server: terminal outcome of one build. Sent exactly once per
// build_id, including on failure/cancellation.
message NodeBuildResult {
  string build_id = 1;
  bool ok = 2;
  // "clone_failed", "step_failed", "artifact_not_found", "upload_failed",
  // "timeout", "cancelled", …
  string error_code = 3;
  string error_message = 4;
  bool retryable = 5;
  string stage_reached = 6;
  // On success: what was uploaded.
  string artifact_sha256 = 7;
  int64 artifact_size_bytes = 8;
}

// ─── Async host-tool jobs (Xcode auto-install) ──────────────────────────────
//
// The synchronous InstallHostTool channel (field 52) waits for the node to
// finish inside one ack window (~600s). A full Xcode install — a ~12GB .xip
// download plus 20-60 minutes of `xip -x` extraction — can never fit that
// window, so Xcode moves to the same async job pattern the build pipeline
// uses: the server dispatches NodeHostToolJob, the node acks "accepted"
// within seconds, then streams NodeHostToolJobEvent progress frames and a
// single terminal NodeHostToolJobResult. The server keeps an in-memory
// snapshot per job for polling; the result is the only durable truth.

// Server -> node: run one long-running host-tool install job. tool is a
// whitelist id (currently only "xcode"); download_url is an https .xip direct
// link the SERVER resolved (xcodereleases data) — the node only validates it
// defensively. sha256 is optional: xcodereleases publishes no digest, and the
// .xip format carries Apple's own signature verification, so an empty sha256
// falls back to a size check against download_size_bytes (which also powers
// the disk-space precheck and the download progress denominator).
// proxy_* mirrors NodeSelfUpgrade.
message NodeHostToolJob {
  string job_id = 1;
  string tool = 2;               // "xcode" (whitelist on the server)
  string target_version = 3;    // e.g. "16.2" — informational + short-circuit check
  string download_url = 4;      // https .xip direct link
  int64 download_size_bytes = 5; // disk precheck + progress denominator
  string sha256 = 6;            // optional; empty = size check + xip signature
  int64 timeout_seconds = 7;    // whole-job budget; 0 = node default (4h)
  string proxy_mode = 8;        // "" | "network" | "url_prefix"
  string proxy_url = 9;
  string proxy_url_prefix = 10;
}

// Server -> node: cancel a running host-tool job at the next stage boundary.
message NodeHostToolJobCancel {
  string job_id = 1;
}

// Node -> server: one progress step of a host-tool job. stage ∈
// checking / downloading / verifying / extracting / moving / activating /
// probing (free-form; the UI renders verbatim). current/total bytes are set
// during downloading so the UI can show real GB progress; seq is monotonic
// per job.
message NodeHostToolJobEvent {
  string job_id = 1;
  int64 seq = 2;                 // monotonic per job
  string stage = 3;
  string message = 4;
  int32 percent = 5;             // 0-100 where estimable, else 0
  string reported_at = 6;        // RFC3339
  string log_tail = 7;           // bounded, redacted diagnostics tail
  int64 current_bytes = 8;       // download progress numerator
  int64 total_bytes = 9;         // download progress denominator
}

// Node -> server: terminal outcome of one host-tool job. Sent exactly once
// per job_id, including on failure/cancellation. error_code vocabulary:
// not_darwin / incompatible_macos / insufficient_space / download_failed /
// extract_failed / move_failed / activate_failed / probe_failed / cancelled /
// busy / timeout. When the checking stage finds the requested version already
// installed, ok=true with stage_reached="checking" (no download ran).
message NodeHostToolJobResult {
  string job_id = 1;
  bool ok = 2;
  string error_code = 3;
  string error_message = 4;
  bool retryable = 5;
  string stage_reached = 6;
  // On success: the freshly probed xcodebuild version, folded straight into
  // the node's capability labels by the server (no re-register needed).
  string xcodebuild_version = 7;
  // On success: where the app bundle landed (e.g. /Applications/Xcode-16.2.app).
  string app_path = 8;
}
