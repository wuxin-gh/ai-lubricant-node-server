message ManageNodeEnvironmentRequest {
  string node_id = 1;
  string env_id = 2;
  EnvironmentAction action = 3;
}

message ManageNodeEnvironmentResponse {
  string node_id = 1;
  string env_id = 2;
  string action = 3;
  // exists is set on CREATE acks: false means the node refused (e.g. the env
  // mode is not enabled on this node, or the directory could not be created).
  bool exists = 4;
}

message SyncNodeEnvironmentRequest {
  string node_id = 1;
  string env_id = 2;
  repeated SkillSpec skills = 3;
  repeated NodePluginSpec plugins = 4;
