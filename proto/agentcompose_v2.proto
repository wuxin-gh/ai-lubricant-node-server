syntax = "proto3";

package agentcompose.v2;

option go_package = "ai-lubricant-nodes/common/proto/agentcompose/v2;agentcomposev2";

service ProjectService {
  rpc ValidateProject(ValidateProjectRequest) returns (ValidateProjectResponse);
  rpc ApplyProject(ApplyProjectRequest) returns (ApplyProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
  rpc WatchProject(WatchProjectRequest) returns (stream WatchProjectResponse);
}

service RunService {
  rpc RunAgent(RunAgentRequest) returns (RunAgentResponse);
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  // Stable server-stream projection of RunAgent for non-interactive stream views.
  // Interactive clients that need stdin, resize, signal, or multi-turn prompt
  // attachment should use RunAttach.
  rpc RunAgentStream(RunAgentRequest) returns (stream RunAgentStreamResponse);
  rpc RunAttach(stream RunAttachRequest) returns (stream RunAttachResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc FollowRunLogs(FollowRunLogsRequest) returns (stream RunLogChunk);
  rpc StopRun(StopRunRequest) returns (StopRunResponse);
}

service ExecService {
  rpc Exec(ExecRequest) returns (ExecResponse);
  // Stable server-stream projection of Exec for non-interactive stream views.
  // Interactive clients that need stdin, resize, or signal attachment should use
  // ExecAttach.
  rpc ExecStream(ExecRequest) returns (stream ExecStreamResponse);
  rpc ExecAttach(stream ExecAttachRequest) returns (stream ExecAttachResponse);
}

service ImageService {
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  rpc InspectImage(InspectImageRequest) returns (InspectImageResponse);
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);
  rpc BuildImage(BuildImageRequest) returns (stream BuildImageEvent);
}

service CacheService {
  rpc ListCaches(ListCachesRequest) returns (ListCachesResponse);
  rpc InspectCache(InspectCacheRequest) returns (InspectCacheResponse);
  rpc PruneCaches(PruneCachesRequest) returns (PruneCachesResponse);
  rpc RemoveCache(RemoveCacheRequest) returns (RemoveCacheResponse);
}

service VolumeService {
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  rpc InspectVolume(InspectVolumeRequest) returns (InspectVolumeResponse);
  rpc RemoveVolume(RemoveVolumeRequest) returns (RemoveVolumeResponse);
  rpc PruneVolumes(PruneVolumesRequest) returns (PruneVolumesResponse);
}

service SandboxService {
  rpc RemoveSandbox(RemoveSandboxRequest) returns (RemoveSandboxResponse);
  rpc GetSandboxStats(GetSandboxStatsRequest) returns (GetSandboxStatsResponse);
}

// NodeService is the control plane for distributed execution nodes. An
// execution node dials the server outbound and holds a single long-lived
// bidirectional stream (NodeConnect): the node sends registration, heartbeats,
// session output, and results; the server pushes session commands
// (create/delete/list) back down the same stream. This inverts the connection
// direction so nodes can live behind NAT/firewalls and come online on demand.
//
// The unary RPCs (ListNodes/ApproveNode/RevokeNode) are the management-plane
// surface consumed by management nodes; they are independent of the execution
// stream.
service NodeService {
  // NodeConnect is the node's single outbound long-lived stream. The node is
  // the dialer; the server reverse-dispatches session commands over it.
  rpc NodeConnect(stream NodeUpstreamFrame) returns (stream NodeDownstreamFrame);

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetPublicIPLookupConfig(GetPublicIPLookupConfigRequest) returns (NodePublicIPLookupConfig);
  rpc UpdatePublicIPLookupConfig(UpdatePublicIPLookupConfigRequest) returns (NodePublicIPLookupConfig);
  rpc GetNodeProxyConfig(GetNodeProxyConfigRequest) returns (NodeProxyConfig);
  rpc UpdateNodeProxyConfig(UpdateNodeProxyConfigRequest) returns (NodeProxyConfig);
  rpc SetNodeLastProxy(SetNodeLastProxyRequest) returns (SetNodeLastProxyResponse);
  rpc SetNodeCapacity(SetNodeCapacityRequest) returns (SetNodeCapacityResponse);
  rpc MoveNode(MoveNodeRequest) returns (MoveNodeResponse);
  rpc ManageEditor(ManageEditorRequest) returns (ManageEditorResponse);
  // ManageNodeEnvironment creates or removes one named shared environment on a
  // node host. The environment is a persistent HOME a session can run against
  // (env_mode="shared"), so installed dependencies and CLI login state outlive
  // any single task. The node owns the on-disk layout; this call carries only
  // the id. Create is idempotent.
  rpc ManageNodeEnvironment(ManageNodeEnvironmentRequest) returns (ManageNodeEnvironmentResponse);
  // SyncNodeEnvironment installs the exact desired skill/plugin set into a shared
  // environment's HOME (environment maintenance — the real install/uninstall).
  rpc SyncNodeEnvironment(SyncNodeEnvironmentRequest) returns (SyncNodeEnvironmentResponse);
  // InspectNodeEnvironment reports what is physically installed in an
  // environment HOME so the caller can diff it against the configured set.
  rpc InspectNodeEnvironment(InspectNodeEnvironmentRequest) returns (InspectNodeEnvironmentResponse);
  // InspectNodeSystemEnv enumerates the skill/plugin/MCP the providers discover
  // in the node operator's REAL HOME (env_mode="system"). Read-only; this is what
  // makes a system-env session's actual capability set visible.
  rpc InspectNodeSystemEnv(InspectNodeSystemEnvRequest) returns (InspectNodeSystemEnvResponse);
  // SyncNodeSystemEnv installs platform resources into that HOME incrementally,
  // and removes ONLY entries the platform installed. It never prunes, so the
  // operator's own resources cannot be deleted through it.
  rpc SyncNodeSystemEnv(SyncNodeSystemEnvRequest) returns (SyncNodeSystemEnvResponse);
  // ArchiveNodeSystemEnvResource tars one resource out of that HOME and uploads
  // it back so a locally installed skill/plugin can enter the platform library.
  rpc ArchiveNodeSystemEnvResource(ArchiveNodeSystemEnvResourceRequest) returns (ArchiveNodeSystemEnvResourceResponse);
  rpc SelfUpgradeNode(SelfUpgradeNodeRequest) returns (SelfUpgradeNodeResponse);
  rpc RuntimeUpgradeNode(RuntimeUpgradeNodeRequest) returns (RuntimeUpgradeNodeResponse);
  rpc HostExec(HostExecRequest) returns (HostExecResponse);
  // HostFileUpload streams one chunk of a file upload to a node host. The
  // caller splits the file into bounded chunks and sends one unary request per
  // chunk (upload_id correlates them); the node appends to a temp file and
  // atomically renames on the final chunk after verifying size+sha256.
  rpc HostFileUpload(HostFileUploadRequest) returns (HostFileUploadResponse);
  rpc ApproveNode(ApproveNodeRequest) returns (ApproveNodeResponse);
  rpc RevokeNode(RevokeNodeRequest) returns (RevokeNodeResponse);
  // DeleteNode permanently removes a node record (any status) and drops its live
  // connection. Unlike RevokeNode — which keeps the record in a revoked state
  // for audit — this is a hard delete: the record and its sealed credential are
  // gone. An online node is refused unless force is set; a management node that
  // still owns execution nodes is always refused (delete or reassign its
  // execution nodes first) so it cannot orphan them.
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteNodeResponse);

  // OnboardNode provisions a new node. For the execution role it pre-creates a
  // pending record, mints a per-node TOTP secret, and returns the secret + a
  // ready-to-run install command; manager_node_id is REQUIRED and must name an
  // existing management node that owns it. For the management role it creates a
  // passive ownership container: approved and online immediately, with no secret
  // and no client process (it only groups execution nodes).
  rpc OnboardNode(OnboardNodeRequest) returns (OnboardNodeResponse);
  // RevokeOnboardNode closes the onboarding loop: for a node that has not yet
  // registered it deletes the pending record and invalidates the token; for a
  // node that already registered it revokes it (like RevokeNode) and drops the
  // live connection. Idempotent.
  rpc RevokeOnboardNode(RevokeOnboardNodeRequest) returns (RevokeOnboardNodeResponse);

  // DispatchSession places a session on a connected node: the server picks (or
  // is told) a node, reverse-dispatches a CreateSession command over that node's
  // NodeConnect stream, waits for the node's ack, and persists the session→node
  // binding. This is the phase-1 standalone dispatch entrypoint; it does not go
  // through the run controller.
  rpc DispatchSession(DispatchSessionRequest) returns (DispatchSessionResponse);
  // DeleteNodeSession tears a session down on its owning node and clears the
  // binding.
  rpc DeleteNodeSession(DeleteNodeSessionRequest) returns (DeleteNodeSessionResponse);
  // FollowNodeSession streams a session's output/result frames as the owning
  // node reports them upstream. Used to watch a dispatched task live.
  rpc FollowNodeSession(FollowNodeSessionRequest) returns (stream NodeSessionEvent);
  // SendSessionInput delivers a user turn (or EOF) into an interactive session's
  // running provider process on its owning node. Multi-turn currently supports
  // the codex provider.
  rpc SendSessionInput(SendSessionInputRequest) returns (SendSessionInputResponse);

  // ── Split-config session control (each reverse-dispatches a downstream command
  // to the session's owning node and returns the node's config ack). The server
  // assigns the monotonic revision; the node reports applied/effective revision
  // and whether a runtime restart is needed to make the change live. ──
  //
  // ConfigureNodeSessionLLM points the session's editor directly at an LLM
  // service (no server proxy) by writing the provider-specific config/env.
  rpc ConfigureNodeSessionLLM(ConfigureNodeSessionLLMRequest) returns (NodeSessionConfigAck);
  // ApplyNodeSessionMCPs sets the full desired MCP server set for a session.
  rpc ApplyNodeSessionMCPs(ApplyNodeSessionMCPsRequest) returns (NodeSessionConfigAck);
  // ApplyNodeSessionSkills sets the full desired skill set for a session.
  rpc ApplyNodeSessionSkills(ApplyNodeSessionSkillsRequest) returns (NodeSessionConfigAck);
  // ApplyNodeSessionPlugins sets the full desired plugin set for a session.
  rpc ApplyNodeSessionPlugins(ApplyNodeSessionPluginsRequest) returns (NodeSessionConfigAck);
  // ConfigureNodeSessionMode selects the editor's permission/approval mode.
  rpc ConfigureNodeSessionMode(ConfigureNodeSessionModeRequest) returns (NodeSessionConfigAck);
  // StartNodeSessionRuntime starts a session created with defer_start.
  rpc StartNodeSessionRuntime(StartNodeSessionRuntimeRequest) returns (NodeSessionConfigAck);
  // RestartNodeSessionRuntime restarts the editor to apply pending config.
  rpc RestartNodeSessionRuntime(RestartNodeSessionRuntimeRequest) returns (NodeSessionConfigAck);
  // CollectNodeSessionArtifacts asks the node to package the session workspace
  // for retrieval through the tunnel.
  rpc CollectNodeSessionArtifacts(CollectNodeSessionArtifactsRequest) returns (NodeSessionConfigAck);
}

enum ProjectValidationSeverity {
  PROJECT_VALIDATION_SEVERITY_UNSPECIFIED = 0;
  PROJECT_VALIDATION_SEVERITY_WARNING = 1;
  PROJECT_VALIDATION_SEVERITY_ERROR = 2;
}

enum ProjectChangeAction {
  PROJECT_CHANGE_ACTION_UNSPECIFIED = 0;
  PROJECT_CHANGE_ACTION_CREATED = 1;
  PROJECT_CHANGE_ACTION_UPDATED = 2;
  PROJECT_CHANGE_ACTION_REMOVED = 3;
  PROJECT_CHANGE_ACTION_UNCHANGED = 4;
}

enum ProjectWatchEventType {
  PROJECT_WATCH_EVENT_TYPE_UNSPECIFIED = 0;
  PROJECT_WATCH_EVENT_TYPE_APPLIED = 1;
  PROJECT_WATCH_EVENT_TYPE_REMOVED = 2;
  PROJECT_WATCH_EVENT_TYPE_CHANGED = 3;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_SUCCEEDED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELED = 5;
}

enum RunSource {
  RUN_SOURCE_UNSPECIFIED = 0;
  RUN_SOURCE_MANUAL = 1;
  RUN_SOURCE_SCHEDULER = 2;
  RUN_SOURCE_API = 3;
}

enum RunAgentStreamEventType {
  RUN_AGENT_STREAM_EVENT_TYPE_UNSPECIFIED = 0;
  RUN_AGENT_STREAM_EVENT_TYPE_STARTED = 1;
  RUN_AGENT_STREAM_EVENT_TYPE_OUTPUT = 2;
  RUN_AGENT_STREAM_EVENT_TYPE_STATUS = 3;
  RUN_AGENT_STREAM_EVENT_TYPE_COMPLETED = 4;
}

enum RunSandboxCleanupPolicy {
  reserved "RUN_SESSION_CLEANUP_POLICY_UNSPECIFIED";
  reserved "RUN_SESSION_CLEANUP_POLICY_STOP_ON_COMPLETION";
  reserved "RUN_SESSION_CLEANUP_POLICY_KEEP_RUNNING";
  reserved "RUN_SESSION_CLEANUP_POLICY_REMOVE_ON_COMPLETION";

  RUN_SANDBOX_CLEANUP_POLICY_UNSPECIFIED = 0;
  RUN_SANDBOX_CLEANUP_POLICY_STOP_ON_COMPLETION = 1;
  RUN_SANDBOX_CLEANUP_POLICY_KEEP_RUNNING = 2;
  RUN_SANDBOX_CLEANUP_POLICY_REMOVE_ON_COMPLETION = 3;
}

enum ExecStreamEventType {
  EXEC_STREAM_EVENT_TYPE_UNSPECIFIED = 0;
  EXEC_STREAM_EVENT_TYPE_STARTED = 1;
  EXEC_STREAM_EVENT_TYPE_OUTPUT = 2;
  EXEC_STREAM_EVENT_TYPE_COMPLETED = 3;
}

enum AttachRunMode {
  ATTACH_RUN_MODE_UNSPECIFIED = 0;
  ATTACH_RUN_MODE_COMMAND = 1;
  ATTACH_RUN_MODE_PROMPT = 2;
}

enum StdioStream {
  STDIO_STREAM_UNSPECIFIED = 0;
  STDIO_STREAM_STDOUT = 1;
  STDIO_STREAM_STDERR = 2;
}

enum ImageStoreKind {
  IMAGE_STORE_KIND_UNSPECIFIED = 0;
  IMAGE_STORE_KIND_DOCKER_DAEMON = 1;
  IMAGE_STORE_KIND_OCI_CACHE = 2;
}

enum ImageAvailabilityStatus {
  IMAGE_AVAILABILITY_STATUS_UNSPECIFIED = 0;
  IMAGE_AVAILABILITY_STATUS_AVAILABLE = 1;
  IMAGE_AVAILABILITY_STATUS_MISSING = 2;
  IMAGE_AVAILABILITY_STATUS_ERROR = 3;
}

enum ImageOperationStatus {
  IMAGE_OPERATION_STATUS_UNSPECIFIED = 0;
  IMAGE_OPERATION_STATUS_SUCCEEDED = 1;
  IMAGE_OPERATION_STATUS_FAILED = 2;
  IMAGE_OPERATION_STATUS_RUNNING = 3;
}

enum MetricStatus {
  METRIC_STATUS_UNSPECIFIED = 0;
  METRIC_STATUS_OK = 1;
  METRIC_STATUS_UNKNOWN = 2;
  METRIC_STATUS_UNAVAILABLE = 3;
}

enum CacheDomain {
  reserved "CACHE_DOMAIN_SESSION_EPHEMERAL_STATE";

  CACHE_DOMAIN_UNSPECIFIED = 0;
  CACHE_DOMAIN_OCI_IMAGE_STORE = 1;
  CACHE_DOMAIN_MATERIALIZED_IMAGE_CACHE = 2;
  CACHE_DOMAIN_RUNTIME_DERIVED_CACHE = 3;
  CACHE_DOMAIN_SANDBOX_EPHEMERAL_STATE = 4;
}

enum CacheStatus {
  CACHE_STATUS_UNSPECIFIED = 0;
  CACHE_STATUS_ACTIVE = 1;
  CACHE_STATUS_REFERENCED = 2;
  CACHE_STATUS_UNUSED = 3;
  CACHE_STATUS_EXPIRED = 4;
  CACHE_STATUS_ORPHANED = 5;
  CACHE_STATUS_UNKNOWN = 6;
}

message ValidateProjectRequest {
  ProjectSpec spec = 1;
  ProjectSource source = 2;
  string expected_spec_hash = 3;
}

message ValidateProjectResponse {
  bool valid = 1;
  repeated ProjectValidationIssue issues = 2;
  string spec_hash = 3;
}

message ApplyProjectRequest {
  ProjectSpec spec = 1;
  ProjectSource source = 2;
  string expected_spec_hash = 3;
  bool dry_run = 4;
}

message ApplyProjectResponse {
  Project project = 1;
  ProjectRevision revision = 2;
  repeated ProjectChange changes = 3;
  repeated ProjectValidationIssue issues = 4;
  bool applied = 5;
  bool unchanged = 6;
}

message GetProjectRequest {
  ProjectRef project = 1;
  bool include_spec = 2;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  string query = 1;
  bool include_removed = 2;
  uint32 offset = 3;
  uint32 limit = 4;
}

message ListProjectsResponse {
  repeated ProjectSummary projects = 1;
  uint32 total_count = 2;
  bool has_more = 3;
  uint32 next_offset = 4;
}

message RemoveProjectRequest {
  reserved "stop_running_sessions";

  ProjectRef project = 1;
  bool remove_history = 2;
  bool stop_running_sandboxes = 3;
}

message RemoveProjectResponse {
  Project project = 1;
  repeated ProjectChange changes = 2;
}

message WatchProjectRequest {
  ProjectRef project = 1;
}

message WatchProjectResponse {
  ProjectWatchEventType type = 1;
  Project project = 2;
  ProjectRevision revision = 3;
  repeated ProjectChange changes = 4;
}

message ProjectRef {
  string project_id = 1;
  string name = 2;
  string source_path = 3;
}

message ProjectSource {
  string compose_path = 1;
  string project_dir = 2;
}

message Project {
  ProjectSummary summary = 1;
  ProjectSpec spec = 2;
  repeated ProjectAgent agents = 3;
  repeated ProjectScheduler schedulers = 4;
}

message ProjectSummary {
  string project_id = 1;
  string name = 2;
  string source_path = 3;
  uint64 current_revision = 4;
  string spec_hash = 5;
  uint32 agent_count = 6;
  uint32 scheduler_count = 7;
  uint32 running_run_count = 8;
  string latest_run_id = 9;
  string created_at = 10;
  string updated_at = 11;
  string removed_at = 12;
}

message ProjectRevision {
  string project_id = 1;
  uint64 revision = 2;
  string spec_hash = 3;
  ProjectSpec spec = 4;
  string created_at = 5;
}

message ProjectAgent {
  string project_id = 1;
  string agent_name = 2;
  string managed_agent_id = 3;
  string provider = 4;
  string model = 5;
  string image = 6;
  string driver = 7;
  bool scheduler_enabled = 8;
}

message ProjectScheduler {
  string project_id = 1;
  string agent_name = 2;
  string scheduler_id = 3;
  string managed_loader_id = 4;
  bool enabled = 5;
  uint32 trigger_count = 6;
}

message ProjectValidationIssue {
  ProjectValidationSeverity severity = 1;
  string path = 2;
  string message = 3;
}

message ProjectChange {
  ProjectChangeAction action = 1;
  string resource_type = 2;
  string resource_id = 3;
  string name = 4;
  string message = 5;
}

message ProjectSpec {
  string name = 1;
  repeated EnvVarSpec variables = 2;
  reserved 3;
  reserved "workspace";
  repeated AgentSpec agents = 4;
  NetworkSpec network = 5;
  repeated ProjectVolumeSpec volumes = 6;
  repeated NamedWorkspaceSpec workspaces = 7;
  repeated MCPServerSpec mcps = 8;
}

message NamedWorkspaceSpec {
  string name = 1;
  WorkspaceSpec workspace = 2;
}

message AgentSpec {
  string name = 1;
  string provider = 2;
  string model = 3;
  string system_prompt = 4;
  string image = 5;
  DriverSpec driver = 6;
  repeated EnvVarSpec env = 7;
  WorkspaceSpec workspace = 8;
  SchedulerSpec scheduler = 9;
  repeated string capset_ids = 10;
  JupyterSpec jupyter = 11;
  BuildSpec build = 12;
  repeated VolumeMountSpec volumes = 13;
  repeated MCPServerSpec mcps = 14;
  repeated SkillSpec skills = 15;
}

message MCPServerSpec {
  string name = 1;
  string type = 2;
  string transport = 3;
  string command = 4;
  repeated string args = 5;
  repeated EnvVarSpec env = 6;
  string url = 7;
  repeated EnvVarSpec headers = 8;
}

message ProjectVolumeSpec {
  string key = 1;
  string name = 2;
  string driver = 3;
  bool external = 4;
  map<string, string> labels = 5;
  map<string, string> options = 6;
}

message VolumeMountSpec {
  string type = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
}

message BuildSpec {
  string context = 1;
  string dockerfile = 2;
  string target = 3;
  map<string, string> args = 4;
  repeated string platforms = 5;
  repeated string tags = 6;
  bool no_cache = 7;
  bool pull = 8;
}

message EnvVarSpec {
  string name = 1;
  string value = 2;
  bool secret = 3;
}

message WorkspaceSpec {
  string provider = 1;
  string url = 2;
  string branch = 3;
  string path = 4;
  string name = 5;
}

message NetworkSpec {
  string mode = 1;
}

message SchedulerSpec {
  bool enabled = 1;
  repeated TriggerSpec triggers = 2;
  string script = 3;
  string sandbox_policy = 4;
}

message TriggerSpec {
  string name = 1;
  string kind = 2;
  string cron = 3;
  string interval = 4;
  string timeout = 5;
  EventTriggerSpec event = 6;
  string prompt = 7;
  string sandbox_policy = 8;
}

message EventTriggerSpec {
  string topic = 1;
}

message DriverSpec {
  string name = 1;
  BoxliteDriverSpec boxlite = 2;
  DockerDriverSpec docker = 3;
  MicrosandboxDriverSpec microsandbox = 4;
}

message BoxliteDriverSpec {
  string kernel = 1;
  string rootfs = 2;
}

message DockerDriverSpec {
  string host = 1;
}

message MicrosandboxDriverSpec {
  string profile = 1;
}

message RunAgentRequest {
  reserved 5;
  reserved "session_id";

  string project_id = 1;
  string agent_name = 2;
  string prompt = 3;
  RunSource source = 4;
  repeated EnvVarSpec env = 6;
  RunSandboxCleanupPolicy cleanup_policy = 7;
  string scheduler_id = 8;
  string trigger_id = 9;
  string output_schema_json = 10;
  string client_request_id = 11;
  string command = 12;
  RunJupyterSpec jupyter = 13;
  string driver = 14;
  string sandbox_id = 15;
  repeated VolumeMountSpec volumes = 16;
  string payload_json = 17;
}

message RunAgentResponse {
  RunDetail run = 1;
  repeated string warnings = 2;
}

message RunAgentStreamResponse {
  RunAgentStreamEventType event_type = 1;
  RunSummary run = 2;
  string run_id = 3;
  string chunk = 4;
  StdioStream stream = 5;
  string created_at = 6;
  repeated string warnings = 7;
  TranscriptEvent transcript = 8;
}

message RunAttachRequest {
  string client_frame_id = 15;

  oneof frame {
    RunAttachStart start = 1;
    AttachStdin stdin = 2;
    AttachStdinEOF stdin_eof = 3;
    AttachResize resize = 4;
    AttachSignal signal = 5;
    AttachHumanMessage human_message = 6;
    AttachCancel cancel = 7;
  }
}

message RunAttachResponse {
  string server_frame_id = 15;
  string created_at = 16;

  oneof frame {
    AttachStarted started = 1;
    AttachOutput output = 2;
    AttachAgentEvent agent_event = 3;
    AttachAgentTurnCompleted agent_turn_completed = 4;
    AttachResult result = 5;
    AttachError error = 6;
  }
}

message RunAttachStart {
  RunAgentRequest request = 1;
  AttachRunMode mode = 2;
  bool attach_stdin = 3;
  bool tty = 4;
  AttachTerminalSize terminal_size = 5;
}

message TranscriptEvent {
  StdioStream stream = 1;
  string text = 2;
  string name = 4;
  string payload_json = 5;
  string created_at = 6;
}

message GetRunRequest {
  string run_id = 1;
  string project_id = 2;
}

message GetRunResponse {
  RunDetail run = 1;
}

message ListRunsRequest {
  reserved 3;
  reserved "session_id";

  string project_id = 1;
  string agent_name = 2;
  string scheduler_id = 4;
  RunStatus status = 5;
  RunSource source = 6;
  string started_from = 7;
  string started_to = 8;
  uint32 offset = 9;
  uint32 limit = 10;
  string sandbox_id = 11;
}

message ListRunsResponse {
  repeated RunSummary runs = 1;
}

message FollowRunLogsRequest {
  string project_id = 1;
  string run_id = 2;
  uint32 tail_lines = 3;
  uint64 start_offset = 4;
  bool follow = 5;
}

message RunLogChunk {
  string data = 1;
  uint64 offset = 2;
  bool is_final = 3;
  RunStatus run_status = 4;
  string created_at = 5;
}

message StopRunRequest {
  string run_id = 1;
  string reason = 2;
}

message StopRunResponse {
  RunDetail run = 1;
  bool stop_requested = 2;
}

message RemoveSandboxRequest {
  string sandbox_id = 1;
  bool force = 2;
}

message RemoveSandboxResponse {
  string sandbox_id = 1;
  bool stopped = 2;
  bool removed = 3;
}

message GetSandboxStatsRequest {
  string sandbox_id = 1;
}

message GetSandboxStatsResponse {
  SandboxStats stats = 1;
}

message MetricValue {
  optional double value = 1;
  string unit = 2;
  MetricStatus status = 3;
  string message = 4;
}

message SandboxStats {
  string sandbox_id = 1;
  string driver = 2;
  string sampled_at = 3;
  MetricValue cpu_percent = 4;
  MetricValue memory_usage_bytes = 5;
  MetricValue memory_limit_bytes = 6;
  MetricValue memory_percent = 7;
  MetricValue network_rx_bytes = 8;
  MetricValue network_tx_bytes = 9;
  MetricValue block_read_bytes = 10;
  MetricValue block_write_bytes = 11;
  MetricValue uptime_seconds = 12;
}

message RunSummary {
  reserved 11;
  reserved "session_id";

  string run_id = 1;
  string project_id = 2;
  string project_name = 3;
  uint64 project_revision = 4;
  string agent_id = 5;
  string agent_name = 6;
  RunSource source = 7;
  string scheduler_id = 8;
  string trigger_id = 9;
  RunStatus status = 10;
  int32 exit_code = 12;
  string error = 13;
  string started_at = 14;
  string completed_at = 15;
  int64 duration_ms = 16;
  string created_at = 17;
  string updated_at = 18;
  repeated string warnings = 19;
  string sandbox_id = 20;
  string run_short_id = 21;
  string sandbox_short_id = 22;
}

message RunDetail {
  RunSummary summary = 1;
  string prompt = 2;
  string output = 3;
  string result_json = 4;
  string logs_path = 5;
  string artifacts_dir = 6;
  string cleanup_error = 7;
  string driver = 8;
  string image_ref = 9;
  repeated string warnings = 10;
}

message ExecRequest {
  reserved "session_id";

  oneof target {
    string sandbox_id = 1;
    string run_id = 2;
